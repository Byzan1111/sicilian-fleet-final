function gearRows(slot){
  var avail=[];
  STORY.slice(0,pos+1).forEach(function(node){if(node&&node.t==='camp'&&Array.isArray(node.gear))node.gear.forEach(function(id){if(avail.indexOf(id)<0)avail.push(id)})});
  var here=STORY[pos].gear||[];
  var sortKey=flags._sort||'new',showOwned=!!flags._owned,hero=null;
  party.forEach(function(p){if(p.id===sortKey)hero=p});
  var pool=avail.filter(function(id){return GEAR[id]&&GEAR[id].slot===slot&&usableNames(id).length});
  var items=pool.filter(function(id){return inv.gear.indexOf(id)<0});
  var owned=showOwned?pool.filter(function(id){return inv.gear.indexOf(id)>=0}):[];
  if(hero){
    items=items.filter(function(id){return canEquip(hero,id)});
    items.sort(function(x,y){return gearScore(hero,y)-gearScore(hero,x)});
  }else items.sort(function(x,y){var nx=here.indexOf(x)>=0?0:1,ny=here.indexOf(y)>=0?0:1;return nx-ny||GEAR[y].tier-GEAR[x].tier||GEAR[x].price-GEAR[y].price});
  var CAP=8,all=flags._all&&flags._all[slot],hidden=0;
  if(!all&&items.length>CAP){hidden=items.length-CAP;items=items.slice(0,CAP)}
  var rows=items.map(function(id){
    var g=GEAR[id],names=usableNames(id);
    var kind=g.slot==='relic'?(g.who?'Personal relic':'Relic'):TYPE_SING[g.type];
    var desc=kind+' · '+g.desc+' '+(names.length?'Usable by '+names.join(', ')+'.':'No one in your company can use this.');
    return shopRow(g.name,desc,g.price,'buy:'+id,0,here.indexOf(id)>=0);
  });
  if(hidden)rows.push('<div class="btnrow" style="margin-top:8px"><button class="btn ghost" data-act="showall:'+slot+'">Show '+hidden+' more items</button></div>');
  else if(all&&items.length>CAP)rows.push('<div class="btnrow" style="margin-top:8px"><button class="btn ghost" data-act="showall:'+slot+'">Show fewer</button></div>');
  owned.forEach(function(id){
    var g=GEAR[id],by=equippedBy(id);
    rows.push('<div class="shoprow owned"><div><b>'+esc(g.name)+'</b> <span class="tag-new" style="background:#6b6b6b;color:#eee">Owned</span><small>'+esc(g.desc)+' · '+(by>=0?'Equipped by '+esc(party[by].name):'In the stash')+'</small></div><div class="buy"><span class="price">&mdash;</span></div></div>');
  });
  return rows;
}
function renderCamp(){
  var s=STORY[pos],rows=[];
  CONS.forEach(function(c){rows.push(shopRow(c.name,c.desc,c.price,'buy:'+c.id,inv[c.id]))});
  var weaponRows=gearRows('weapon'),armorRows=gearRows('armor'),relicRows=gearRows('relic');
  var trained=flags.training&&flags.training[s.id];
  var trainingHtml=trained?
    '<p class="camp-note">Training completed: '+(trained==='attack'?'Weapons drill (+2 attack for every companion).':'Shield drill (+2 defence for every companion).')+' You may train only once at this camp.</p>':
    '<p class="camp-note">Choose one drill for the whole company. Training costs 10 gold and can be taken only once at this camp.</p><div class="training-grid">'+
    '<article class="training-card"><h4>Weapons drill</h4><p>Each companion gains +2 permanent attack. Best for ending dangerous fights quickly.</p><button class="btn ghost" data-act="train:attack"'+(inv.gold<10?' disabled':'')+'>Train · 10 gold</button></article>'+
    '<article class="training-card"><h4>Shield drill</h4><p>Each companion gains +2 permanent defence. Best for enduring heavy enemy attacks.</p><button class="btn ghost" data-act="train:defense"'+(inv.gold<10?' disabled':'')+'>Train · 10 gold</button></article></div>';

  /* side quests */
  var cdef=SQ_DEFS[s.id],sqDone=sqState(s.id);
  var questHtml='';
  if(cdef){
    var left=cdef.quests.filter(function(q){return !sqDone[q.id]}).length;
    questHtml='<section class="shop"><h3>Side quests</h3><p class="camp-note">Each quest is two skirmishes against a random band of ordinary foes, with no bosses. Win for EXP and gold, then return here. If the company falls you lose nothing. '+(left?left+' of 3 remain at this camp.':'All three are complete.')+'</p><div class="sq-grid">'+
      cdef.quests.map(function(q){
        var done=sqDone[q.id];
        return '<article class="sq-card'+(done?' done':'')+'"><h4>'+esc(q.title)+(done?' <span class="tag-new" style="background:#5d9b64">Done</span>':'')+'</h4><p>'+esc(q.blurb)+'</p><small>Reward: about '+q.xp+' EXP each and '+q.gold[0]+'–'+q.gold[1]+' gold'+(q.id==='n1'&&(flags.morality||0)>=3?' (Merciful: deserters parley, −40% gold)':'')+'</small>'+
          (done?'':'<button class="btn ghost" data-act="sq:'+q.id+'">Begin quest</button>')+'</article>';
      }).join('')+'</div></section>';
  }

  /* Campfire Interludes */
  var talkData=CAMP_TALKS[s.id]||{};
  var companionButtons=party.filter(function(p){return p.id!=='nik'&&talkData[p.id]}).map(function(p){return p.id});
  var activeTalkCompanion=flags._activeTalk;
  if(companionButtons.indexOf(activeTalkCompanion)<0)activeTalkCompanion=companionButtons[0];
  flags._activeTalk=activeTalkCompanion;
  var talkList=(activeTalkCompanion&&talkData[activeTalkCompanion])||[];
  var talkIndex=(flags._talks&&flags._talks[activeTalkCompanion])||0;
  var currentTalkText=talkList.length?(talkList[talkIndex%talkList.length]||''):'';
  if(typeof currentTalkText==='function')currentTalkText=currentTalkText();
  var campfireHtml='<section class="shop"><h3>Campfire Interludes</h3><p class="camp-note">Gather by the fire to speak with your companions before breaking camp.</p>'+
    '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px">'+
    companionButtons.map(function(cid){
      var h=HEROES[cid];
      var active=activeTalkCompanion===cid;
      return '<button class="btn '+(active?'':'ghost')+'" data-act="talk:'+cid+'" style="display:flex;align-items:center;gap:8px;padding:6px 12px">'+
        '<span style="width:32px;height:32px;display:inline-block;border-radius:50%;overflow:hidden;background:var(--ink);border:1px solid var(--gold)">'+fig(h.art)+'</span>'+
        '<span>'+esc(h.name)+'</span></button>';
    }).join('')+'</div>'+
    (currentTalkText?'<div class="dialog" style="margin-top:12px;min-height:90px"><div class="portrait">'+fig(HEROES[activeTalkCompanion].art)+'</div>'+
    '<div style="min-width:0"><div class="who">'+esc(HEROES[activeTalkCompanion].name)+'</div><p class="text">'+esc(currentTalkText)+'</p>'+
    '<div style="margin-top:8px"><button class="btn ghost" data-act="nexttalk">Another thought</button></div></div></div>':'')+
    '</section>';

  var eq=party.map(function(u,hi){
    var sel=SLOTS.map(function(sl){
      var currentId=u.eq[sl[0]]||null;
      var opts=['<option value=""'+(!currentId?' selected':'')+'>None'+esc(gearCompareLabel(null,currentId))+'</option>'];
      inv.gear.forEach(function(id){
        var g=GEAR[id];if(g.slot!==sl[0]||!canEquip(u,id))return;
        var by=equippedBy(id),ownershipNote='';
        if(by!==-1&&by!==hi)ownershipNote=' · currently equipped by '+party[by].name+'; selecting transfers it';
        opts.push('<option value="'+id+'"'+(currentId===id?' selected':'')+'>'+esc(g.name+' ('+g.desc+')'+ownershipNote+gearCompareLabel(id,currentId))+'</option>');
      });
      return '<label>'+sl[1]+'<select id="eq-'+hi+'-'+sl[0]+'" data-eq="'+hi+':'+sl[0]+'">'+opts.join('')+'</select></label>';
    }).join('');
    var need=xpNeed(u.lv),pc=u.lv>=LEVEL_CAP?100:Math.round((u.xp||0)/need*100);
    return '<div class="eqcard"><div class="eqname">'+esc(u.name)+' <small>level '+u.lv+'</small></div>'+
      '<div class="xpbar"><i style="width:'+pc+'%"></i></div><div class="stats">'+(u.lv>=LEVEL_CAP?'Max level':(u.xp||0)+' / '+need+' EXP')+'</div>'+
      '<div class="stats">'+statLine(u)+'</div><div class="stats prof">'+esc(profText(HEROES[u.id]))+'</div>'+sel+'</div>';
  }).join('');
  var y=window.scrollY||0;
  var qLeft=cdef?cdef.quests.filter(function(q){return !sqDone[q.id]}).length:0;
  var tab=flags._tab||(qLeft?'quests':'market');
  if((tab==='quests'||tab==='drill')&&!cdef)tab='market';
  var tabs=[];if(cdef)tabs.push(['quests','Quests'+(qLeft?' ('+qLeft+')':'')]);if(cdef)tabs.push(['drill','Drill']);tabs.push(['market','Market'],['equip','Gear'],['fire','Fireside']);
  var tabBar='<nav class="tabbar" aria-label="Camp sections">'+tabs.map(function(t){return '<button class="tab'+(t[0]===tab?' on':'')+'" data-act="tab:'+t[0]+'">'+t[1]+'</button>'}).join('')+'<button class="btn tabgo" data-act="campgo" title="Break camp and move on">Depart</button></nav>';
  var mk=flags._mk||'weapon',cats=[['supply','Supplies',rows],['weapon','Weapons',weaponRows],['armor','Armour',armorRows],['relic','Relics',relicRows]];
  var sortHtml=(mk==='supply')?'':'<div class="chips sortrow"><span class="olabel">Sort</span><button class="chip'+((flags._sort||'new')==='new'?' on':'')+'" data-act="sort:new">Newest</button>'+party.map(function(p){return '<button class="chip'+(flags._sort===p.id?' on':'')+'" data-act="sort:'+p.id+'">Best for '+esc(p.name)+'</button>'}).join('')+'<button class="chip'+(flags._owned?' on':'')+'" data-act="owned:1">Show owned</button></div>';
  var mkBody='<section class="shop"><div class="chips">'+cats.map(function(c){return '<button class="chip'+(c[0]===mk?' on':'')+'" data-act="mk:'+c[0]+'">'+c[1]+(c[0]!=='supply'?' <small>'+c[2].length+'</small>':'')+'</button>'}).join('')+'</div>'+sortHtml+
    cats.filter(function(c){return c[0]===mk})[0][2].join('')+'</section>';
  var body='';
  var formHtml='<h3 style="margin:0 0 4px">Formation</h3><p class="camp-note">The line runs left to right. The Vanguard draws more enemy attacks and the Rear fewer. Eirene’s Guard and Phalanx shield the companions standing on either side of her, so place her beside the ones you want protected.</p><div class="formrow">'+party.map(function(u,i){return '<div class="formcell"><div class="fh">'+fig(u.art)+'</div><b style="font-size:.85rem">'+esc(u.name)+'</b><small>'+(party.length>2&&i===0?'Vanguard':party.length>2&&i===party.length-1?'Rearguard':'Line')+'</small><div class="mv"><button class="btn ghost" data-act="form:'+i+'l"'+(i===0?' disabled':'')+'>◀</button><button class="btn ghost" data-act="form:'+i+'r"'+(i===party.length-1?' disabled':'')+'>▶</button></div></div>'}).join('')+'</div>';
  if(tab==='quests')body=questHtml;
  else if(tab==='drill')body=drillHtml(s.id);
  else if(tab==='market')body=mkBody;
  else if(tab==='equip')body='<section class="eq">'+formHtml+'<div class="btnrow" style="margin-bottom:10px"><button class="btn ghost" data-act="autoequip">Auto-equip best gear</button></div><div class="eqgrid">'+eq+'</div></section>';
  else body='<section class="shop"><h3>Company training</h3>'+trainingHtml+'</section>'+campfireHtml+'<div class="btnrow" style="margin-top:12px"><button class="btn ghost" data-act="codex">Field manual</button></div>';
  view.innerHTML=
   '<div class="frame stage slim">'+sceneArt(s.art)+'</div>'+
   '<div class="camp-head"><h2>Camp: '+esc(s.place)+'</h2><span class="goldbar">'+inv.gold+' gold <button class="btn" data-act="slots:save" style="margin-left:14px">Save / Load</button></span></div>'+
   (campMsgs.length?campMsgs.map(function(m){return '<p class="camp-note camp-msg">'+esc(m)+'</p>'}).join(''):'')+
   tabBar+body;
  setMusic((tab==='fire'&&activeTalkCompanion==='smb')?'smbat':'camp');
  if(window.scrollTo&&y)window.scrollTo(0,y);
}

/* ---------- input ---------- */
view.addEventListener('click',function(e){
  var t=e.target.closest('.targetable,[data-act]');
  if(!t)return;
  audioInit();interacted=true;kickMusic();
  if(t.classList.contains('targetable')){if(screen==='battle'&&B&&!B.locked)chooseTarget(+t.dataset.i);return}
  var p=String(t.dataset.act).split(':'),a=p[0],arg=p[1];
  if(screen!=='battle')sfx('click');
  if(a==='enter'){showTitle()}
  else if(a==='log'){openLog()}
  else if(a==='syn'){openSynergies()}
  else if(a==='ngplus'){startNgPlus()}
  else if(a==='endless'||a==='endlessagain'){startEndless()}
  else if(a==='slots'){openSlots(arg)}
  else if(a==='drill'&&screen==='camp'){startDrill(STORY[pos].id)}
  else if(a==='drillagain'&&SQ&&SQ.drill){rollDrill()}
  else if(a==='form'&&screen==='camp'){moveHero(parseInt(arg,10),arg.slice(-1))}
  else if(a==='codex'){showCodex()}
  else if(a==='codexback'){if(codexReturn==='camp'){screen='camp';renderCamp()}else{showTitle();var ds=document.getElementById('difficulty');if(ds&&DIFFICULTIES[codexDifficulty]){ds.value=codexDifficulty;difficulty=codexDifficulty;var dh=document.getElementById('difficulty-help');if(dh)dh.textContent=DIFFICULTIES[codexDifficulty].desc+' Continue always uses the saved campaign difficulty.'}}}
  else if(a==='begin'){var diffEl=document.getElementById('difficulty');newGame(diffEl?diffEl.value:'standard');clearSave();advance()}
  else if(a==='cont'){var sv=loadSave();if(sv){applySave(sv);advance()}else showTitle()}
  else if(a==='go'){var s=STORY[pos],n=nextLine(s,sceneLine+1);if(n===-1){pos++;advance()}else{sceneLine=n;showScene()}}
  else if(a==='choose'){
    var line=STORY[pos].lines[sceneLine];
    if(line&&line[0]==='_choice'&&!replied){var o=line[1].opts[+arg];if(o){replied=true;logPush('You',o.label);o.fx();showReply(o.reply)}}
  }
  else if(a==='talk'&&screen==='camp'){
    flags._activeTalk=arg;
    sfx('click');renderCamp();
  }
  else if(a==='nexttalk'&&screen==='camp'){
    var sNode=STORY[pos],cid=flags._activeTalk;
    flags._talks=flags._talks||{};
    var list=CAMP_TALKS[sNode.id]&&CAMP_TALKS[sNode.id][cid];
    if(list){
      flags._talks[cid]=((flags._talks[cid]||0)+1)%list.length;
      sfx('click');renderCamp();
    }
  }
  else if(a==='buy'&&screen==='camp'){
    var price=null;
    CONS.forEach(function(c){if(c.id===arg)price=c.price});
    if(price===null&&GEAR[arg])price=GEAR[arg].price;
    if(price!==null&&inv.gold>=price){
      inv.gold-=price;
      if(GEAR[arg])inv.gear.push(arg);else inv[arg]=(inv[arg]||0)+1;
      sfx('heal');save();renderCamp();
    }
  }
  else if(a==='train'&&screen==='camp'){
    var camp=STORY[pos],kind=arg;
    flags.training=flags.training||{};
    if(camp&&camp.t==='camp'&&!flags.training[camp.id]&&inv.gold>=10&&(kind==='attack'||kind==='defense')){
      inv.gold-=10;flags.training[camp.id]=kind;
      party.forEach(function(u){if(kind==='attack')u.atk+=2;else u.def+=2});
      sfx('heal');save();renderCamp();
    }
  }
  else if(a==='sq'&&screen==='camp'){startQuest(STORY[pos].id,arg)}
  else if(a==='sqnext'&&SQ){SQ.wave++;rollWave()}
  else if(a==='sqcamp'){SQ=null;B=null;enterCamp()}
  else if(a==='sqabandon'&&SQ){party=clone(SQ.snap.party);inv=clone(SQ.snap.inv);flags=clone(SQ.snap.flags);SQ=null;B=null;enterCamp()}
  else if(a==='tab'&&screen==='camp'){flags._tab=arg;renderCamp();if(window.scrollTo)window.scrollTo(0,0)}
  else if(a==='mk'&&screen==='camp'){flags._mk=arg;renderCamp()}
  else if(a==='sort'&&screen==='camp'){flags._sort=arg;renderCamp()}
  else if(a==='owned'&&screen==='camp'){flags._owned=!flags._owned;renderCamp()}
  else if(a==='showall'&&screen==='camp'){flags._all=flags._all||{};flags._all[arg]=!flags._all[arg];renderCamp()}
  else if(a==='autoequip'&&screen==='camp'){autoEquip();save();renderCamp()}
  else if(a==='campgo'){campMsgs=[];pos++;advance()}
  else if(a==='next'){pos++;advance()}
  else if(a==='retry'&&B){var snap=B.snap,bi=B.bi;party=clone(snap.party);inv=clone(snap.inv);flags=clone(snap.flags);startBattle(bi)}
  else if(a==='quit'||a==='again'){showTitle()}
  else if(a==='endlessquit'&&screen==='battle'&&B&&B.endless){quitEndless()}
  else if(a==='toggle-autobattle'&&screen==='battle'&&B&&!B.over){toggleAuto()}
  else if(screen==='battle'&&B&&!B.locked)battleClick(a,arg);
});
view.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('targetable')){e.preventDefault();e.target.click()}
});
view.addEventListener('change',function(e){
  var el=e.target;
  if(el&&el.id==='difficulty'){
    var selected=DIFFICULTIES[el.value],hint=document.getElementById('difficulty-help');
    if(selected&&hint)hint.textContent=selected.desc+' Continue always uses the saved campaign difficulty.';
    return;
  }
  if(!el||!el.dataset||!el.dataset.eq||screen!=='camp')return;
  var p=el.dataset.eq.split(':'),u=party[+p[0]];
  if(!u)return;
  var slot=p[1],nextId=el.value||null;
  if(nextId){
    var previousOwner=equippedBy(nextId);
    if(previousOwner!==-1&&previousOwner!==+p[0]){
      var oldOwner=party[previousOwner];
      Object.keys(oldOwner.eq).forEach(function(oldSlot){if(oldOwner.eq[oldSlot]===nextId)oldOwner.eq[oldSlot]=null});
      clampVitals(oldOwner);
    }
  }
  if(nextId&&!canEquip(u,nextId))return;
  u.eq[slot]=nextId;clampVitals(u);sfx('click');save();renderCamp();
});

/* ---------- battle ---------- */
function mkFoe(k,d){
  var f=clone(FOES[k]);
  f.hp=Math.round(f.hp*((d&&d.hpMul)||1));f.atk=Math.round(f.atk*((d&&d.atkMul)||1));
  f.key=k;f.maxhp=f.hp;f.st=noSt();f.buff=0;f.defending=false;f.cd=1;f.acd=f.aoe?(f.aoe.first||2):0;f.atele=false;f.hcd=0;f.tele=false;f.sabotageTele=false;f.boardTele=false;f.alarmTele=false;f.cdMax=f.cdMax||2;
  return f;
}
function unitOf(t){return t.side==='ally'?party[t.i]:B.foes[t.i]}
function livingFoes(){var r=[];B.foes.forEach(function(f,i){if(f.hp>0)r.push(i)});return r}
function livingParty(){var r=[];party.forEach(function(p,i){if(p.hp>0)r.push(i)});return r}
function say(t){B.log.push(t)}
function pct(a,b){return Math.max(0,Math.min(100,Math.round(a/b*100)))}
function addReinforcement(key,message){
  var d=BATTLES[B.bi],scale=DIFFICULTIES[difficulty]||DIFFICULTIES.standard;
  B.foes.push(mkFoe(key,{hpMul:(d.hpMul+ngHp())*scale.hp,atkMul:d.atkMul*scale.atk}));
  say(message);
}
function addReinforcement2(b,key){var d=BATTLES[b.bi],scale=DIFFICULTIES[difficulty]||DIFFICULTIES.standard;b.foes.push(mkFoe(key,{hpMul:(d.hpMul+ngHp())*scale.hp,atkMul:d.atkMul*scale.atk}))}
function run(p){if(p&&p.catch)p.catch(function(e){if(window.console)console.error(e)})}

function tuneObjective(o){
  if(!o)return;
  if(o.id==='grain-carts')o.sabotageDamage=difficulty==='veteran'?40:difficulty==='chronicle'?22:28;
  else if(o.id==='boarding')o.boardDamage=difficulty==='veteran'?22:difficulty==='chronicle'?10:12;
  else if(o.id==='barracks-alarm'&&difficulty==='veteran')o.maxSignals=1;
  else if(o.id==='signal-flare'){
    o.turns=difficulty==='veteran'?5:difficulty==='chronicle'?8:7;
    o.maxTurns=o.turns;
  }
  else if(o.id==='vault-seal'){
    o.turns=difficulty==='veteran'?4:difficulty==='chronicle'?7:6;
    o.maxTurns=o.turns;
  }
  else if(o.id==='bridge-hold'){
    o.turns=difficulty==='veteran'?6:difficulty==='chronicle'?4:5;
    o.maxTurns=o.turns;
  }
}
function battleTrack(n){
  if(n===7)return 'bardas';
  if(n===ENDSLOT||n===SQSLOT)return 'alt';
  return (n===4||n===5)?'boss':'battle';
}
function sceneMood(s){
  var endAt=STORY.findIndex(function(n){return n.t==='scene'&&n.place==='The estates of Nicaea · Spring 1026'});
  if(endAt>=0&&pos>=endAt)return 'end_'+(flags.ending||'neutral');
  var p=s.place||'',a=s.art;
  if(a==='fire'||/sea-wall postern/.test(p))return 'sorrow';
  if(/Dyrrhachium, on the Adriatic/.test(p))return 'smbat';
  if(a==='sea')return 'voyage';
  if(/^(palace|boucoleon|vaults|stoudios|chrysopolis|bridge)$/.test(a)||/estates of Nicaea, Bithynia/.test(p))return 'mystery';
  return 'camp';
}
function startBattle(n){
  var d=BATTLES[n],ids=typeof d.foes==='function'?d.foes():d.foes;
  var scale=DIFFICULTIES[difficulty]||DIFFICULTIES.standard;
  var foeScale={hpMul:(d.hpMul+ngHp())*scale.hp,atkMul:d.atkMul*scale.atk};
  party.forEach(function(p){p.buff=0;p.dbuff=0;p.defending=false;p.st=noSt()});
  B={bi:n,sq:(n===SQSLOT?SQ:null),foes:ids.map(function(k){return mkFoe(k,foeScale)}),round:1,queue:[],cur:null,actor:0,mode:'locked',locked:true,over:false,
     objective:d.objective?clone(d.objective):null,
     autoBattle:false,acts:[],synDone:{},endless:!!d.endless,wave:0,killed:0,
     log:[d.intro,d.hint],fx:[],vfx:[],anim:[],pend:null,gauge:30,deadSeen:{},shake:false,
     snap:{party:clone(party),inv:clone(inv),flags:clone(flags)}};
  tuneObjective(B.objective);
  if(B.objective&&B.objective.id==='barracks-alarm')B.log[1]='Tip: stop archers who display “Raising alarm!” before their next turn. On Veteran, even one completed signal summons reinforcements.';
  if(B.objective&&B.objective.id==='signal-flare')B.log[1]='Tip: the flare countdown is '+B.objective.turns+' rounds on '+DIFFICULTIES[difficulty].name+'. Venom arrows poison; Mend and Theriac cure it. Rashid telegraphs a stunning blow, so Guard when he gathers himself.';
  if(B.objective&&B.objective.id==='vault-seal')B.log[1]='Tip: each Palace Guard blunts blows against Michael, so thin them first. Strike the assassin before his poison spreads. Guard when Michael raises his jeweled dagger. If the countdown ends, another assassin joins.';
  if(flags.mercy===false&&n!==SQSLOT)B.gauge+=15;
  if(flags.crowd&&n!==SQSLOT)B.gauge+=15;
  if(d.setup)d.setup(B);
  setMusic(battleTrack(n));

  run(nextTurn());
}
function buildQueue(){
  var q=[];
  party.forEach(function(p,i){if(p.hp>0)q.push({side:'ally',i:i,k:spdOf(p)*rnd(.85,1.15)})});
  B.foes.forEach(function(f,i){if(f.hp>0)q.push({side:'foe',i:i,k:spdOf(f)*rnd(.85,1.15)})});
  q.sort(function(a,b){return b.k-a.k});
  B.queue=q;
}
async function nextTurn(){
  for(;;){
    if(B.over)return;
    if(B.objective&&B.objective.id==='grain-carts'&&B.objective.hp<=0)return lose('The grain carts are burned. The company cannot let the supply convoy fall.');
    if(B.bi===2&&B.foes.some(function(f){return f.key==='leon'&&f.hp<=0}))return win();
    if(B.bi===4&&B.foes.some(function(f){return f.key==='admiral'&&f.hp<=0}))return win();
    if(B.bi===5&&B.foes.some(function(f){return f.key==='chamberlain'&&f.hp<=0}))return win();
    if(B.bi===7&&B.foes.some(function(f){return f.key==='bardas'&&f.hp<=0}))return win();
    if(B.objective&&B.objective.id==='bridge-hold'&&B.objective.turns<=0)return win();
    if(B.endless&&B.foes.every(function(f){return f.hp<=0}))endlessRefill();
    if(B.foes.every(function(f){return f.hp<=0}))return win();
    if(party.every(function(p){return p.hp<=0}))return lose('Every companion is down.');
    if(!B.queue.length){await endRound();buildQueue();continue}
    var t=B.queue.shift(),u=unitOf(t);
    if(u.hp<=0)continue;
    B.cur=t;
    if(u.st.stun>0){
      u.st.stun--;if(t.side==='foe')u.atele=false;
      if(t.side==='foe'&&u.sabotageTele){u.sabotageTele=false;say(u.name+' is stunned and drops the torch. The grain carts are safe for now.');}
      else if(t.side==='foe'&&u.boardTele){u.boardTele=false;say(u.name+' is stunned before the grapnels can be hauled in. The boarding push is broken.');}
      else if(t.side==='foe'&&u.alarmTele){u.alarmTele=false;say(u.name+' is stunned before the alarm can be sounded.');}
      else say(u.name+' is stunned and loses the turn.');
      B.vfx.push({side:t.side,i:t.i,kind:'stun'});B.locked=true;B.mode='locked';renderBattle();await sleep(850);continue;
    }
    if(t.side==='ally'){
      u.defending=false;B.actor=t.i;
      if(difficulty!=='veteran'&&B.autoBattle){
        autoBattleAction();
        return;
      }
      B.mode='menu';B.locked=false;renderBattle();return;
    }
    B.locked=true;B.mode='locked';renderBattle();await sleep(400);
    if(B.over)return;
    foeTurn(u,t.i);
    renderBattle();await sleep(850);
  }
}
function toggleAuto(){
  if(difficulty==='veteran'||!B||B.over)return;
  B.autoBattle=!B.autoBattle;
  sfx('click');
  var canAct=!B.locked&&(B.mode==='menu'||B.mode==='skills'||B.mode==='items'||B.mode==='tfoe'||B.mode==='tally');
  if(B.autoBattle&&canAct){B.pend=null;autoBattleAction()}
  else renderBattle();

function autoBattleAction(){
  var foes=livingFoes();
  if(!foes.length)return;
  var me=party[B.actor];
  if(!me||me.hp<=0)return;
  /* heal the weakest wounded companion with bread when someone is in danger */
  if(inv.bread>0){
    var worst=-1,wr=1;
    party.forEach(function(p,i){if(p.hp>0){var r=p.hp/mhp(p);if(r<wr){wr=r;worst=i}}});
    if(worst>=0&&wr<0.35){run(perform({type:'item',id:'bread'},worst));return}
  }
  if(B.gauge>=100){run(perform({type:'acclaim'}));return}
  /* brace when a foe is gathering a heavy blow and this companion is hurt */
  var winding=B.foes.some(function(f){return f.hp>0&&(f.tele||f.atele)});
  if(winding&&me.hp/mhp(me)<0.6){run(perform({type:'guard'}));return}
  /* otherwise strike the foe closest to falling */
  var best=foes[0];
  foes.forEach(function(i){if(B.foes[i].hp<B.foes[best].hp)best=i});
  run(perform({type:'attack'},best));
}
function dot(u,side,i,n,kind){
  u.hp=Math.max(0,u.hp-n);
  B.fx.push({side:side,i:i,text:String(n),cls:'dmg'});
  B.vfx.push({side:side,i:i,kind:kind==='burn'?'fire':'poison'});
  say(u.name+(kind==='burn'?' burns':' suffers from poison')+' (-'+n+').'+(u.hp<=0?(side==='foe'?' It falls.':' It is down.'):''));
}
async function endRound(){
  B.locked=true;B.mode='locked';
  if(B.endless){B.killed=(B.killed||0)+B.foes.filter(function(f){return f.hp<=0}).length;B.foes=B.foes.filter(function(f){return f.hp>0});B.cur=null;Object.keys(B.deadSeen).forEach(function(k){if(k.indexOf('foe')===0)delete B.deadSeen[k]})}
  var tick=false,all=[];
  party.forEach(function(p,i){all.push([p,'ally',i])});
  B.foes.forEach(function(f,i){all.push([f,'foe',i])});
  all.forEach(function(x){
    var u=x[0];if(u.hp<=0)return;
    if(u.st.burn>0){u.st.burn--;dot(u,x[1],x[2],8,'burn');tick=true}
    if(u.hp>0&&u.st.poison>0){u.st.poison--;dot(u,x[1],x[2],6,'poison');tick=true}
    if(u.st.weak>0)u.st.weak--;
    if(u.buff>0)u.buff--;
    if(u.dbuff>0)u.dbuff--;
  });
  var o=B.objective;
  if(o&&o.id==='signal-flare'&&!o.alerted&&o.turns>0){
    o.turns--;
    if(o.turns<=0&&B.foes.some(function(f){return f.hp>0})){
      o.alerted=true;
      addReinforcement('corsair','The tower flare blazes. A corsair relief boat reaches the stair and another fighter joins the battle!');
    }
  }
  if(o&&o.id==='vault-seal'&&!o.alerted&&o.turns>0){
    o.turns--;
    if(o.turns<=0&&B.foes.some(function(f){return f.hp>0})){
      o.alerted=true;
      addReinforcement('assassin','Michael’s hidden reserve breaches the vault door. Another assassin steps into the fray!');
    }
  }
  if(o&&o.id==='bridge-hold'&&o.turns>0){
    o.turns--;
    if(o.turns>0&&o.turns===o.maxTurns-2&&B.foes.some(function(f){return f.hp>0&&f.key==='bardas'})){
      addReinforcement('phokarch','The Phokan rearguard reaches the bridge, and an archer starts shooting from the far parapet!');
    }
    if(o.turns<=0)say('Hooves thunder on the far bank. The imperial horse has arrived!');
  }
  B.round++;
  B.acts=[];B.synDone={};B.facts=[];B.fsyn={};
  if(B.endless&&B.round>1&&B.round%5===1)endlessWave();
  if(tick){renderBattle();await sleep(750)}
}

function calcDmg(att,def,mult,el){
  LASTEL=el||null;
  if(mult==null)mult=1;
  var d=atkOf(att)*mult-defOf(def)*0.5,eff=null;
  var equippedWeapon=att&&att.eq&&GEAR[att.eq.weapon];
  if(equippedWeapon&&equippedWeapon.effect==='opening'&&def.st&&def.st.weak>0)d*=1.15;
  if(el){
    if(def.weak&&def.weak.indexOf(el)>=0){d*=1.5;eff='weak'}
    else if(def.res&&def.res.indexOf(el)>=0){d*=0.7;eff='res'}
  }
  if(B&&B.bi===4&&B.objective&&B.objective.id==='command-escort'&&def.key==='admiral'){
    var escorts=B.foes.filter(function(f){return f.key==='guard2'&&f.hp>0}).length;
    if(escorts>0)d*=Math.pow(0.8,escorts);
  }
  if(B&&B.bi===5&&B.objective&&B.objective.id==='vault-seal'&&def.key==='chamberlain'){
    var guards=B.foes.filter(function(f){return f.key==='court_guard'&&f.hp>0}).length;
    if(guards>0)d*=Math.pow(0.85,guards);
  }
  var crit=Math.random()<critOf(att);if(crit)d*=1.5;
  if(def.defending)d*=0.5;
  return {dmg:Math.max(1,Math.round(d*rnd(.9,1.1))),crit:crit,eff:eff};
}
function hitUnit(u,side,i,r){
  u.hp=Math.max(0,u.hp-r.dmg);
  B.fx.push({side:side,i:i,text:r.dmg+(r.eff==='weak'?'!':''),cls:r.crit?'crit':'dmg'});
  if(r.dmg>=28||r.crit)B.shake=true;
  sfx(u.defending?'block':r.crit?'crit':'hit');
  B.gauge=Math.min(100,B.gauge+(side==='foe'?4:8));
  if(u.hp<=0)say(u.name+(side==='foe'?' falls.':' is down.'));
}
function healUnit(u,i,n){
  n=Math.max(0,Math.min(n,mhp(u)-u.hp));u.hp+=n;
  B.fx.push({side:'ally',i:i,text:'+'+n,cls:'heal'});
}

function chooseFoeTarget(live,f){

}

function foeAoe(f,i){

function foeHealerAct(f,i){
  if(f.hcd>0)f.hcd--;

function foeComboCheck(f,i){

function foeTurnCore(f,i){
  var live=livingParty();
  if(!live.length)return;
  if(B.bi===0&&B.objective&&f.key==='bailiff'){
    if(f.sabotageTele){
      f.sabotageTele=false;
      var loss=B.objective.sabotageDamage||28;
      B.objective.hp=Math.max(0,B.objective.hp-loss);
      say(f.name+' hurls the torch at the grain carts. Cargo integrity falls by '+loss+'.');
      B.vfx.push({side:'foe',i:i,kind:'fire'});
    }else{
      f.sabotageTele=true;
      say(f.name+' breaks from the fight and raises a torch over the grain carts. Stop him before his next turn!');
      B.vfx.push({side:'foe',i:i,kind:'buff'});
    }
    return;
  }
  if(B.bi===1&&B.objective&&B.objective.id==='boarding'&&f.key==='captain'){
    if(f.boardTele){
      f.boardTele=false;B.objective.boards++;B.objective.pressure=Math.min(B.objective.maxPressure,B.objective.pressure+50);
      say(f.name+' hauls the grapnels tight and corsairs surge aboard. Boarding pressure rises.');
      B.vfx.push({side:'foe',i:i,kind:'slash'});
      if(B.objective.pressure>=B.objective.maxPressure){
        B.objective.pressure=0;
        var impact=B.objective.boardDamage||12;
        party.forEach(function(p,pi){if(p.hp>0){p.hp=Math.max(0,p.hp-impact);B.fx.push({side:'ally',i:pi,text:String(impact),cls:'dmg'});B.vfx.push({side:'ally',i:pi,kind:'slash'})}});
        say('The boarders seize the rail. Everyone in the company takes '+impact+' damage before they are driven back.');
      }
    }else{
      f.boardTele=true;
      say(f.name+' orders the grapnels hauled in and prepares a boarding push. Stop him before his next turn!');
      B.vfx.push({side:'foe',i:i,kind:'buff'});
    }
    return;
  }
  if(B.bi===2&&B.objective&&B.objective.id==='barracks-alarm'&&f.key==='marcher'&&!B.objective.alerted){
    if(f.alarmTele){
      f.alarmTele=false;B.objective.signals++;
      say(f.name+' reaches the yard horn and sounds an alarm ('+B.objective.signals+'/2).');
      B.vfx.push({side:'foe',i:i,kind:'buff'});
      if(B.objective.signals>=B.objective.maxSignals){
        B.objective.alerted=true;
        addReinforcement('marcher','A horn answers from the yard. Another mutinous archer rushes into the fight!');
      }
    }else{
      f.alarmTele=true;
      say(f.name+' breaks from the line to sound the yard horn. Stop the runner before his next turn!');
      B.vfx.push({side:'foe',i:i,kind:'buff'});
    }
    return;
  }
  if(f.boss&&!f.enraged&&f.hp<f.maxhp/2){
    f.enraged=true;f.atk=Math.round(f.atk*1.15);f.cdMax=1;if(f.aoe)f.aoe.cd=Math.max(1,f.aoe.cd-1);
    say(f.name+' '+(f.rage||'roars in fury!'));
    B.vfx.push({side:'foe',i:i,kind:'buff'});
    return;
  }
  if(f.role==='healer'&&foeHealerAct(f,i))return;
  if(f.atele){f.atele=false;foeAoe(f,i);return}
  if(f.aoe&&!f.tele&&f.acd<=0&&!(f.heavy&&f.cd<=0)){
    f.atele=true;f.acd=f.aoe.cd;
    say(f.name+' '+f.aoe.windup+'. A sweeping attack is coming. Guard!');
    B.vfx.push({side:'foe',i:i,kind:'buff'});
    return;
  }
  if(f.aoe&&f.acd>0)f.acd--;
  if(f.heavy){
    if(f.tele){f.tele=false;foeHit(f,i,chooseFoeTarget(live,f),f.heavy,f.heavyVerb,true);return}
    if(f.cd<=0){
      f.tele=true;f.cd=f.cdMax;
      say(f.name+' '+f.windup+'. A heavy blow is coming. Guard!');
      B.vfx.push({side:'foe',i:i,kind:'buff'});
      return;
    }
    f.cd--;
  }
  foeHit(f,i,chooseFoeTarget(live,f),1,f.verb,false);
}
function foeHit(f,i,ti,mult,verb,heavy){
  var t=party[ti],guarded=t.defending,r=calcDmg(f,t,mult,null);

    else if(f.special&&Math.random()<f.special.chance&&f.special.kind==='poison'){t.st.poison=3;say(t.name+' is poisoned!');B.vfx.push({side:'ally',i:ti,kind:'poison'})}
  }

  else if(a==='items'){B.mode='items';renderBattle()}
  else if(a==='guard'){run(perform({type:'guard'}))}
  else if(a==='acclaim'){if(B.gauge>=100)run(perform({type:'acclaim'}))}
  else if(a==='back'){B.mode='menu';B.pend=null;renderBattle()}
  else if(a==='skill'){
    var sk=SKILLS[arg];
    if(!sk||me.mp<skCost(arg)||(sk.lv||1)>me.lv)return;
    B.pend={type:'skill',id:arg};
    if(sk.tgt==='enemy'){B.mode='tfoe';renderBattle()}
    else if(sk.tgt==='ally'){B.mode='tally';renderBattle()}
    else run(perform(B.pend));
  }
  else if(a==='item'){
    if(!(inv[arg]>0))return;
    B.pend={type:'item',id:arg};B.mode='tally';renderBattle();
  }
  else if(a==='toggle-autobattle'){
    B.autoBattle=!B.autoBattle;
    sfx('click');renderBattle();
    if(B.autoBattle&&B.mode==='menu'&&!B.locked){autoBattleAction()}
  }
}
function chooseTarget(i){
  if(!B.pend)return;
  if(B.mode==='tfoe'&&!(B.foes[i]&&B.foes[i].hp>0))return;
  if(B.mode==='tally'&&!(party[i]&&party[i].hp>0))return;
  if(B.mode!=='tfoe'&&B.mode!=='tally')return;
  run(perform(B.pend,i));
}
async function perform(pend,target){
  B.locked=true;B.mode='locked';B.pend=null;
  var a=party[B.actor],ai=B.actor,weakHit=false;
  if(pend.type==='attack'){
    var f=B.foes[target],r=calcDmg(a,f,1,a.el),weapon=a.eq&&GEAR[a.eq.weapon];
    hitUnit(f,'foe',target,r);
    B.vfx.push({side:'foe',i:target,kind:a.el==='pierce'?'pierce':'slash'});
    say(a.name+' strikes '+f.name+(r.crit?'. A critical hit!':'.'));
    if(weapon&&weapon.effect==='acclamation'){
      B.gauge=Math.min(100,B.gauge+2);
      say('The Guardsman’s Spatha turns the clean strike into momentum (+2 Acclamation).');
    }
    if(weapon&&weapon.effect==='sunder'&&f.hp>0){
      f.st.weak=Math.max(f.st.weak,2);
      say(f.name+'’s guard is sundered. Its defence is weakened.');
      B.vfx.push({side:'foe',i:target,kind:'buff'});
    }
    if(weapon&&weapon.effect==='mana')a.mp=Math.min(mmp(a),a.mp+2);
    if(weapon&&weapon.effect==='stun'&&f.hp>0&&!f.boss&&Math.random()<.2){f.st.stun=1;say(f.name+' is knocked senseless by the blow.');B.vfx.push({side:'foe',i:target,kind:'stun'})}
    if(weapon&&weapon.effect==='ignite'&&f.hp>0&&Math.random()<.35){f.st.burn=Math.max(f.st.burn,2);say(f.name+' catches fire.')}
    if(r.eff==='weak')weakHit=true;
  }else if(pend.type==='guard'){
    a.defending=true;say(a.name+' braces behind a shield.');
    if(a.id==='eir'){var gn=phalanxEffect(a,ai,2);if(gn.length)say('The companions beside her ('+gn.join(' and ')+') stand firmer behind her shield (defence up for 2 rounds).')}
  }else if(pend.type==='acclaim'){
    B.gauge=0;
    party.forEach(function(p,i){
      if(p.hp>0){healUnit(p,i,Math.round(mhp(p)*.35));p.st=noSt();p.buff=3;B.vfx.push({side:'ally',i:i,kind:'buff'})}
    });
    sfx('acclaim');
    say('The company roars the acclamation: Polla ta eti! Many years! Wounds close and spirits rise.');
  }else if(pend.type==='item'){
    inv[pend.id]--;
    var t=party[target];
    if(pend.id==='bread'){healUnit(t,target,60);B.vfx.push({side:'ally',i:target,kind:'heal'});say(t.name+' eats bread and drinks watered wine (+60 HP).')}
    else{
      var n=Math.max(0,Math.min(25,mmp(t)-t.mp));t.mp+=n;t.st.poison=0;
      B.fx.push({side:'ally',i:target,text:'+'+n+' MP',cls:'mp'});B.vfx.push({side:'ally',i:target,kind:'heal'});
      say(t.name+' takes theriac and steadies (+'+n+' MP, poison cured).');
    }
  }else{
    var sk=SKILLS[pend.id];a.mp-=skCost(pend.id);
    if(sk.healPct){
      var t1=party[target],h1=Math.max(1,Math.round(mhp(t1)*sk.healPct));healUnit(t1,target,h1);
      if(sk.cleanse)t1.st=noSt();else t1.st.poison=0;
      B.vfx.push({side:'ally',i:target,kind:'heal'});
      say(a.name+' uses '+sk.name+' on '+t1.name+' (+'+h1+' HP'+(sk.cleanse?', every ailment lifts':', poison cured')+').');
    }else if(sk.healAllPct){
      party.forEach(function(p,i){if(p.hp>0){healUnit(p,i,Math.max(1,Math.round(mhp(p)*sk.healAllPct)));if(sk.cleanse)p.st=noSt();B.vfx.push({side:'ally',i:i,kind:'heal'})}});
      say(a.name+' invokes '+sk.name+'. The company is restored ('+Math.round(sk.healAllPct*100)+'% of max HP each'+(sk.cleanse?', ailments lifted':'')+').');
    }else if(sk.selfGuard){
      var pn=phalanxEffect(a,ai,sk.adj);
      say(a.name+' sets the Phalanx and guards.'+(pn.length?' '+pn.join(' and ')+' stand firmer beside her (defence up for '+sk.adj+' rounds).':' No one stands beside her, so only she is covered.'));
    }else if((sk.buff||sk.defUp||sk.guard)&&!sk.mult){
      party.forEach(function(p,i){if(p.hp>0){if(sk.buff)p.buff=Math.max(p.buff,sk.buff);if(sk.defUp)p.dbuff=Math.max(p.dbuff||0,sk.defUp);if(sk.guard)p.defending=true;B.vfx.push({side:'ally',i:i,kind:'buff'})}});
      say(a.name+' uses '+sk.name+'. '+(sk.buff?'Attack rises for '+sk.buff+' rounds. ':'')+(sk.defUp?'Defence rises for '+sk.defUp+' rounds. ':'')+(sk.guard?'The whole company guards.':''));
    }else{
      var kind=sk.fx||(sk.el==='fire'?'fire':sk.el==='pierce'?'pierce':sk.mult?'slash':'buff');
      var extra='',dealt=0;
      var strikeFoe=function(i){
        var fo=B.foes[i];
        if(sk.mult){var rr=calcDmg(a,fo,sk.mult,sk.el);hitUnit(fo,'foe',i,rr);dealt+=rr.dmg;if(rr.eff==='weak')weakHit=true}
        B.vfx.push({side:'foe',i:i,kind:kind});
        if(fo.hp>0){
          if(sk.burn)fo.st.burn=sk.burn;
          if(sk.poison)fo.st.poison=sk.poison;
          if(sk.weak)fo.st.weak=sk.weak;
          if(sk.stun){if(fo.boss)extra=' '+fo.name+' shrugs it off.';else fo.st.stun=sk.stun}
        }
      };
      if(sk.hits){for(var hn=0;hn<sk.hits;hn++){var lf=livingFoes();if(!lf.length)break;strikeFoe(pick(lf))}}
      else (sk.tgt==='all'?livingFoes():[target]).forEach(strikeFoe);
      if(sk.recoil){var rc=Math.max(1,Math.round(mhp(a)*sk.recoil));a.hp=Math.max(1,a.hp-rc);B.fx.push({side:'ally',i:ai,text:String(rc),cls:'dmg'})}
      if(sk.drain&&dealt>0&&a.hp>0)healUnit(a,ai,Math.max(1,Math.round(dealt*sk.drain)));
      if(sk.gauge)B.gauge=Math.min(100,B.gauge+sk.gauge);
      if(sk.mult&&(sk.defUp||sk.buff)){party.forEach(function(p,pi){if(p.hp>0){if(sk.buff)p.buff=Math.max(p.buff,sk.buff);if(sk.defUp)p.dbuff=Math.max(p.dbuff||0,sk.defUp);B.vfx.push({side:'ally',i:pi,kind:'buff'})}})}
      say(a.name+' uses '+sk.name+'.'+(sk.burn?' Fire clings to the foe.':'')+(sk.poison?' The foe is poisoned.':'')+(sk.weak?' Guard is weakened.':'')+(sk.stun?' The foe reels.':'')+(sk.drain?' '+a.name+' drinks in the blow.':'')+(sk.gauge?' The company’s spirits rise.':'')+(sk.mult&&sk.defUp?' The company stands firmer behind her.':'')+extra);
      if(sk.el==='fire'&&sk.mult&&B.foes.some(function(f){return f.hp>0&&f.weak&&f.weak.indexOf('fire')>=0}))say('Pitch and timber catch fast. Heavy damage!');
    }
  }
  if(weakHit&&B.log[B.log.length-1].indexOf('Pitch')<0)say('A weak point! Extra damage.');
  var act={h:a.id,kind:pend.type,sk:pend.type==='skill'?pend.id:null};B.acts.push(act);checkSyn(act);
  B.anim.push({side:'ally',i:ai,cls:'lunge-a'});
  renderBattle();await sleep(800);
  await nextTurn();
}

/* rendering */
function wkHtml(f){
  var h='';
  if(f.weak&&f.weak.length)h+='<div class="wk">Weak: '+f.weak.map(function(e){return ELNAME[e]}).join(', ')+'</div>';
  if(f.res&&f.res.length)h+='<div class="wk rs">Resists: '+f.res.map(function(e){return ELNAME[e]}).join(', ')+'</div>';
  return h||'<div class="wk">&nbsp;</div>';
}
function unitCard(u,side,i){
  var dead=u.hp<=0,key=side+i,dying=false;
  if(dead&&!B.deadSeen[key]){dying=true;B.deadSeen[key]=1}
  var tgt=!dead&&((B.mode==='tfoe'&&side==='foe')||(B.mode==='tally'&&side==='ally'));
  var cur=B.cur&&B.cur.side===side&&B.cur.i===i&&B.mode!=='over'&&!dead;
  var act=cur&&((side==='ally'&&!B.locked)||(side==='foe'&&B.locked));
  var b=[];
  if(u.st.burn>0)b.push('<span class="s-burn">Burning</span>');
  if(u.st.poison>0)b.push('<span class="s-poison">Poisoned</span>');
  if(u.st.stun>0)b.push('<span class="s-stun">Stunned</span>');
  if(u.st.weak>0)b.push('<span class="s-weak">Weakened</span>');
  if(u.buff>0)b.push('<span>Banner</span>');
  if(u.defending)b.push('<span>Guard</span>');
  if(u.sabotageTele&&!dead)b.push('<span class="warn">Torch raised!</span>');
  if(u.boardTele&&!dead)b.push('<span class="warn">Grapnels set!</span>');
  if(u.alarmTele&&!dead)b.push('<span class="warn">Raising alarm!</span>');
  if(u.atele&&!dead)b.push('<span class="warn">Sweeping attack!</span>');
  if(side==='foe'&&u.dbuff>0&&!dead)b.push('<span>Warded</span>');
  if(u.tele&&!dead)b.push('<span class="warn">Winding up!</span>');
  var hpMax=mhp(u);
  return '<div class="unit '+side+(dead?' dead':'')+(dying?' dying':'')+(act?' active':'')+(tgt?' targetable':'')+((u.boss||u.mini)?' big':'')+'" data-side="'+side+'" data-i="'+i+'"'+(tgt?' role="button" tabindex="0"':'')+'>'+
    '<div class="fig">'+fig(u.art)+'</div>'+
    '<div class="uname">'+esc(u.name)+'</div>'+
    (side==='ally'?'<div class="role">'+esc(u.role)+' · L'+u.lv+(party.length>2&&(i===0||i===party.length-1)?'<span class="pos">'+(i===0?'Vanguard':'Rear')+'</span>':'')+'</div>':wkHtml(u))+
    '<div class="bar hp"><i style="width:'+pct(u.hp,hpMax)+'%"></i></div><small>'+u.hp+'/'+hpMax+' HP</small>'+
    (side==='ally'?'<div class="bar mp"><i style="width:'+pct(u.mp,mmp(u))+'%"></i></div><small>'+u.mp+'/'+mmp(u)+' MP</small>':'')+
    '<div class="badges">'+b.join('')+'</div></div>';
}

function objectiveBonusValue(){
  if(!B||!B.objective)return 0;
  var o=B.objective,down=0,alive=0;
  if(o.id==='grain-carts')return o.hp>=70?20:o.hp>0?10:0;
  if(o.id==='boarding')return o.boards===0?25:o.boards===1?10:0;
  if(o.id==='barracks-alarm')return o.signals===0?25:o.signals===1?10:0;
  if(o.id==='signal-flare')return o.alerted?0:25;
  if(o.id==='vault-seal')return o.alerted?0:25;
  if(o.id==='bridge-hold')return B.foes.some(function(f){return f.key==='bardas'&&f.hp<=0})?25:10;
  if(o.id==='command-escort'){
    alive=B.foes.filter(function(f){return f.key==='guard2'&&f.hp>0}).length;down=o.total-alive;
    return down>=2?25:down===1?10:0;
  }
  return 0;
}

function renderBattle(){

  var quitBtn=B.endless?'<button class="btn ghost" data-act="endlessquit" style="padding:.3em .8em;font-size:.75rem">Quit to title</button>':'';
  var synBtn='<button class="btn ghost" data-act="syn" style="padding:.3em .8em;font-size:.75rem">Synergies</button>';

  view.innerHTML=
   '<header class="bhead"><h2>'+esc(d.place)+'</h2><span class="round">'+esc(DIFFICULTIES[difficulty].name+' · Round '+B.round+(B.endless?' · Wave '+(B.wave+1)+' · Slain '+endKills():''))+'</span></header>'+
   '<div class="bgrid"><div class="bmain"><div class="hud">'+order+autoBtn+synBtn+quitBtn+gauge+'</div>'+objectiveHtml()+
   '<div class="arena"><div class="bg">'+sceneArt(d.art)+'</div><div class="shade"></div>'+
   '<section class="foes" aria-label="Enemies">'+B.foes.map(function(f,i){return unitCard(f,'foe',i)}).join('')+'</section>'+

function vfxAt(f){

}
function flushFx(){
  var q=B.fx.splice(0),v=B.vfx.splice(0),an=B.anim.splice(0);
  an.forEach(animAt);v.forEach(vfxAt);q.forEach(popAt);
  if(B.shake){
    B.shake=false;
    var ar=view.querySelector('.arena');
    if(ar){ar.classList.add('shake');setTimeout(function(){ar.classList.remove('shake')},380)}
  }
}

/* ---------- side quests ---------- */
function sqState(campId){flags.sq=flags.sq||{};flags.sq[campId]=flags.sq[campId]||{};return flags.sq[campId]}
function sqTotal(){var n=0;Object.keys(SQ_DEFS).forEach(function(c){n+=SQ_DEFS[c].quests.length});return n}
function sqDoneCount(){var n=0;Object.keys(flags.sq||{}).forEach(function(c){n+=Object.keys(flags.sq[c]).length});return n}
function startQuest(campId,qid){
  var cd=SQ_DEFS[campId];if(!cd)return;
  var def=null;cd.quests.forEach(function(q){if(q.id===qid)def=q});
  if(!def||sqState(campId)[qid])return;
  SQ={camp:campId,id:qid,def:def,cd:cd,wave:1,of:2,snap:{party:clone(party),inv:clone(inv),flags:clone(flags)}};
  rollWave();
}
function rollWave(){
  var def=SQ.def,n=def.count[0]+Math.floor(Math.random()*(def.count[1]-def.count[0]+1)),foes=[];
  for(var i=0;i<n;i++)foes.push(pick(def.pool));
  BATTLES[SQSLOT]={place:def.title+' · Skirmish '+SQ.wave+' of '+SQ.of,art:def.art,foes:foes,gold:0,hpMul:SQ.cd.hpMul,atkMul:SQ.cd.atkMul,
    intro:SQ.wave===1?def.blurb:'Another band closes in, and there is no time to rest.',
    hint:'Tip: this is a side quest. Win both skirmishes to earn EXP and gold. If the company falls you can retry, or return to camp with nothing lost.',
    win:'The skirmish is won.'};
  startBattle(SQSLOT);
}
function xpRowsHtml(gains){
  return '<div class="xplist">'+gains.map(function(g){
    var p=g.p,h=HEROES[p.id],gr=(h&&h.grow)||{hp:12,mp:4,atk:3,def:2},lv=g.to-g.from;
    var need=xpNeed(p.lv),pc=p.lv>=LEVEL_CAP?100:Math.round((p.xp||0)/need*100);
    return '<div class="xprow"><div class="xptop"><span>'+esc(p.name)+' · Level '+p.lv+(lv>0?' <b class="lvup">LEVEL UP</b>':'')+'</span><span>+'+g.amt+' EXP</span></div>'+
      '<div class="xpbar"><i style="width:'+pc+'%"></i></div>'+
      '<small>'+(p.lv>=LEVEL_CAP?'Maximum level reached.':(p.xp||0)+' / '+need+' EXP to level '+(p.lv+1))+(lv>0?' · +'+(lv*gr.hp)+' HP, +'+(lv*gr.mp)+' MP, +'+(lv*gr.atk)+' ATK, +'+(lv*gr.def)+' DEF':'')+'</small></div>';
  }).join('')+'</div>';
}
async function winQuest(){
  var q=SQ,d=q.def;
  if(q.wave<q.of){
    party.forEach(function(p){
      if(p.hp>0){p.hp=Math.min(mhp(p),p.hp+Math.round(mhp(p)*.25));p.mp=Math.min(mmp(p),p.mp+Math.round(mmp(p)*.2))}
      else p.hp=Math.round(mhp(p)*.25);
      p.buff=0;p.dbuff=0;p.defending=false;p.st=noSt();
    });
    screen='result';
    view.innerHTML='<div class="frame stage">'+sceneArt(d.art)+'</div>'+
      '<div class="result"><div class="eyebrow">ΝΙΚΗ · SIDE QUEST</div><h1>Skirmish '+q.wave+' won</h1>'+
      '<p class="lede">The company catches its breath (+25% HP, +20% MP; fallen companions rise at 25%). Another band is closing in.</p>'+
      '<div class="roster">'+party.map(function(p){return '<div><span>'+esc(p.name)+' · level '+p.lv+'</span><span>'+p.hp+'/'+mhp(p)+' HP</span></div>'}).join('')+'</div>'+
      '<button class="btn" data-act="sqnext">Press on</button></div>';
    var nb=view.querySelector('[data-act="sqnext"]');if(nb&&nb.focus)nb.focus({preventScroll:true});
    return;
  }
  var xpAmt=Math.round(d.xp*(0.9+Math.random()*0.2)*(q.drill?1+0.05*Math.min(10,drillState(q.camp).w):1)),gold=d.gold[0]+Math.floor(Math.random()*(d.gold[1]-d.gold[0]+1));
  var gains=[],unlocked=[];
  party.forEach(function(p){
    var was=p.hp>0,amt=was?xpAmt:Math.round(xpAmt*.5),r=awardXp(p,amt);
    gains.push({p:p,amt:amt,from:r.from,to:r.to});
    newSkillsBetween(p,r.from,r.to).forEach(function(n){unlocked.push(p.name+': '+n)});
    p.buff=0;p.dbuff=0;p.defending=false;p.st=noSt();
  });
  var mercyCut=(q.id==='n1'&&(flags.morality||0)>=3);if(mercyCut)gold=Math.round(gold*.6);
  if(q.drill){drillState(q.camp).w++;party.forEach(fullHeal)}else sqState(q.camp)[q.id]=true;
  inv.gold+=gold;
  screen='result';
  save();
  view.innerHTML='<div class="frame stage">'+sceneArt(d.art)+'</div>'+
    '<div class="result"><div class="eyebrow">ΝΙΚΗ · '+(q.drill?'DRILL GROUND':'SIDE QUEST COMPLETE')+'</div><h1>'+esc(d.title)+'</h1>'+
    (mercyCut?'<p class="lede">The deserters trusted your name and laid down their arms without a real fight, so the purse is smaller (−40% gold).</p>':'')+'<p class="lede">Reward: <b style="color:var(--gold-hi)">'+gold+' gold</b> and <b style="color:var(--gold-hi)">'+xpAmt+' EXP</b> for every companion who stood in the fight (fallen companions earn half).</p>'+
    xpRowsHtml(gains)+
    (unlocked.length?'<p class="lede"><b style="color:var(--gold-hi)">New skills:</b> '+esc(unlocked.join(' · '))+'</p>':'')+
    (q.drill?'<button class="btn" data-act="drillagain">Fight again (win '+(drillState(q.camp).w+1)+')</button> ':'')+'<button class="btn'+(q.drill?' ghost':'')+'" data-act="sqcamp">Return to camp</button></div>';
  var cb=view.querySelector('[data-act="sqcamp"]');if(cb&&cb.focus)cb.focus({preventScroll:true});
}

/* results */
async function win(){
  if(B.over)return;
  B.over=true;B.locked=true;B.mode='over';renderBattle();sfx('win');setMusic('story');await sleep(900);
  if(B.sq){await winQuest();return}
  var d=BATTLES[B.bi],fell=[],unlocked=[],objectiveBonus=objectiveBonusValue(),victoryTitle=d.win;
  if(B.bi===2&&B.foes.some(function(f){return f.hp>0}))victoryTitle='Leon yields, and the mutineers fall back from the gate.';
  if(B.bi===4&&B.foes.some(function(f){return f.hp>0}))victoryTitle='Yusuf falls, and his escort breaks ranks.';
  if(B.bi===5&&B.foes.some(function(f){return f.hp>0}))victoryTitle='Michael is defeated, and the vault archives are secured.';
  if(B.bi===7&&B.foes.some(function(f){return f.hp>0}))victoryTitle=B.foes.some(function(f){return f.key==='bardas'&&f.hp<=0})?'Bardas falls on the bridge he meant to cross.':'The bridge holds, and the imperial horse seals the far bank.';
  var plunder=(B.bi===2&&flags.pardon===false)?40:0;
  var hpRecovery=difficulty==='veteran'?.4:difficulty==='chronicle'?.7:.6;
  var mpRecovery=difficulty==='veteran'?.3:difficulty==='chronicle'?.6:.5;
  var fallenRecovery=difficulty==='veteran'?.2:.35;
  var gains=[];
  party.forEach(function(p){
    var was=p.hp>0;if(!was)fell.push(p.name);
    var amt=was?(d.xp||0):Math.round((d.xp||0)*.5),r=awardXp(p,amt);
    gains.push({p:p,amt:amt,from:r.from,to:r.to});
    newSkillsBetween(p,r.from,r.to).forEach(function(n){unlocked.push(p.name+': '+n)});
    p.hp=was?Math.min(mhp(p),p.hp+Math.round(mhp(p)*hpRecovery)):Math.round(mhp(p)*fallenRecovery);
    p.mp=Math.min(mmp(p),p.mp+Math.round(mmp(p)*mpRecovery));
    p.buff=0;p.dbuff=0;p.defending=false;p.st=noSt();
  });
  inv.bread++;inv.gold+=(d.gold||0)+objectiveBonus+plunder;
  screen='result';
  view.innerHTML=
   '<div class="frame stage">'+sceneArt(d.art)+'</div>'+
   '<div class="result"><div class="eyebrow">ΝΙΚΗ · VICTORY</div><h1>'+esc(victoryTitle)+'</h1>'+
   '<p class="lede">Spoils: '+(d.gold?d.gold+' gold':'no gold')+(objectiveBonus?', plus a '+objectiveBonus+' gold bonus for the tactical objective':'')+(plunder?', plus '+plunder+' gold plundered from the barracks you forced':'')+', and one more loaf for the stores.'+(fell.length?' '+esc(fell.join(' and '))+' was carried from the field and earns half the EXP.':'')+'</p>'+
   xpRowsHtml(gains)+
   (unlocked.length?'<p class="lede"><b style="color:var(--gold-hi)">New skills:</b> '+esc(unlocked.join(' · '))+'</p>':'')+
   '<p class="lede">Between battles, the company recovers '+Math.round(hpRecovery*100)+'% HP and '+Math.round(mpRecovery*100)+'% MP; fallen companions return at '+Math.round(fallenRecovery*100)+'% HP.</p>'+
   '<div class="roster">'+party.map(function(p){return '<div><span>'+esc(p.name)+' · level '+p.lv+'</span><span>'+p.hp+'/'+mhp(p)+' HP</span></div>'}).join('')+'</div>'+
   '<button class="btn" data-act="next">Continue</button></div>';
  var nx=view.querySelector('[data-act="next"]');if(nx&&nx.focus)nx.focus({preventScroll:true});
}
function lose(reason){
  if(B.over)return;
  if(B.endless){endlessOver();return}
  B.over=true;B.locked=true;B.mode='over';screen='result';sfx('lose');setMusic('story');
  var headline=reason&&B.objective&&B.objective.hp<=0?'The grain is lost':'The company falls';
  var explanation=reason||'Every companion is down.';
  view.innerHTML=
   '<div class="frame stage">'+sceneArt(BATTLES[B.bi].art)+'</div>'+
   '<div class="result"><div class="eyebrow">ΗΤΤΑ · DEFEAT</div><h1>'+esc(headline)+'</h1>'+
   '<p class="lede">'+esc(explanation)+' Retry from the start of this fight with your stores and gear as they were.</p>'+
   '<div class="btnrow"><button class="btn" data-act="retry">Retry the battle</button>'+(B.sq?'<button class="btn ghost" data-act="sqabandon">Abandon and return to camp</button>':'<button class="btn ghost" data-act="quit">Title</button>')+'</div></div>';
}
function showEnd(){
  screen='end';clearSave();setMusic('end_'+(flags.ending||'neutral'));
  var meta=loadMeta();meta.cleared=true;meta.ng={morality:flags.morality||0,gear:inv.gear.slice(),level:ng+1};saveMeta(meta);
  var E={good:['Basil’s Law','You tracked the poison to Nicaea, broke the Phokas hold on three hundred villages, and brought Basil’s law home. Eirene freed the estate, and Symeon stayed to heal the city.'],
    neutral:['The Quiet Law','You tracked the poison to Nicaea and the law was enforced, slowly and quietly, village by village. Nobody celebrated, and the Empire is a little fairer for it.'],
    evil:['The New Keeper','You tracked the poison to Nicaea and kept what you found. You took the Phokas estate and the keys of the Wardrobe, and the Empire has a new Keeper. Eirene is gone.']}[flags.ending||'neutral'];
  view.innerHTML=
   '<div class="frame stage">'+sceneArt(flags.ending==='evil'?'vaults':flags.ending==='good'?'nicaea':'palace')+'</div>'+
   '<div class="result"><div class="eyebrow">ΤΕΛΟΣ</div><h1>'+esc(E[0])+'</h1>'+
   '<p class="lede">'+esc(E[1])+'</p>'+
   '<p class="lede" style="opacity:.75">The conspiracy is invented. The empire around it is not.</p>'+
   '<p class="lede">Your deeds: <b style="color:var(--gold-hi)">'+moralLabel()+'</b> (morality '+((flags.morality||0)>0?'+':'')+(flags.morality||0)+'). Campaign difficulty: <b style="color:var(--gold-hi)">'+esc(DIFFICULTIES[difficulty].name)+(ng?' · New Game+ '+ng:'')+'</b>. Treasury remaining: <b style="color:var(--gold-hi)">'+inv.gold+' gold</b>.</p>'+
   '<div class="roster">'+party.map(function(p){return '<div><span>'+esc(p.name)+'</span><span>'+esc(p.role)+' · level '+p.lv+'</span></div>'}).join('')+'</div>'+
   '<div class="roster">'+ledger().map(function(l){return '<div><span>'+esc(l)+'</span></div>'}).join('')+'</div>'+
   '<div class="btnrow"><button class="btn" data-act="ngplus">New Game+</button><button class="btn ghost" data-act="again">Title</button></div><p class="lede" style="opacity:.75;margin-top:10px">New Game+ keeps your gear and your moral standing, forces Veteran difficulty and adds 20% enemy health per cycle. The Endless bridge challenge is now open on the title screen.</p></div>';
}

var mb=document.getElementById('mute');
if(mb&&mb.addEventListener)mb.addEventListener('click',toggleMute);
muteLabel();
/* ---- Android / phone lifecycle ---- */
document.addEventListener('visibilitychange',function(){
  try{
    if(document.hidden){
      Object.keys(Mus.tracks).forEach(function(n){var t=Mus.tracks[n];if(t&&!t.paused){t.__wasPlaying=true;t.pause()}});
      if(Snd.ctx&&Snd.ctx.state==='running')Snd.ctx.suspend();
    }else{
      if(Snd.ctx&&Snd.ctx.state==='suspended')Snd.ctx.resume();
      Object.keys(Mus.tracks).forEach(function(n){var t=Mus.tracks[n];if(t&&t.__wasPlaying){t.__wasPlaying=false;var pr=t.play();if(pr&&pr.catch)pr.catch(function(){})}});
    }
  }catch(e){}
});
window.sfBack=function(){
  try{
    if(screen==='title')return 'exit';
    var ov=document.querySelector('.logov');
    if(ov){ov.remove();return 'handled'}
    if(screen==='battle'&&B&&B.endless){quitEndless();return 'handled'}
    if(window.confirm('Return to the title screen? Progress since the last autosave will be lost.')){
      if(B){B.over=true;B.locked=true;B.abandoned=true}
      sfx('click');showTitle();
    }
    return 'handled';
  }catch(e){return 'exit'}
};
showTitle();
})();
</script>
