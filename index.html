<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Sicilian Fleet — Tactical Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Marcellus+SC&display=swap">
<style>
/* Layout: one centred column. Mosaic-arched unit cards on a painted arena, gold tesserae buttons, porphyry ground.
   A single committed look (dark purple and gold), set explicitly so it reads the same on any host. */
:root{
  --ink:#1c0b22;
  --porphyry:#33173f;
  --porphyry-hi:#4d2a5c;
  --gold:#d6a93b;
  --gold-hi:#f2d27a;
  --lapis:#2a5fa8;
  --crimson:#b3263a;
  --ivory:#f1e8d2;
  --ivory-dim:#c2b595;
  --hp:#7fc47f;
  --mp:#6a9be0;
  --foe-hp:#e0775f;
  --font-display:'Marcellus SC','Cinzel',Georgia,serif;
  --font-body:'Cardo',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--ivory);font:17px/1.45 var(--font-body)}
#game{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:16px 40px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:.05em;text-wrap:balance;margin:0}
p{margin:0}
button,select{font:inherit}
:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}

.frame{border:2px solid var(--gold);outline:1px solid rgba(242,210,122,.4);outline-offset:3px;border-radius:3px;overflow:hidden}
.stage{position:relative;aspect-ratio:10/3;max-width:100%;background:var(--porphyry)}
.stage::after,.arena .bg::after{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(28,11,34,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(28,11,34,.3) 1px,transparent 1px);
  background-size:6px 6px}
.stage svg{display:block;width:100%;height:100%}

.btn{font-family:var(--font-display);letter-spacing:.06em;padding:.6em 1.1em;border:1px solid var(--gold-hi);
  background:linear-gradient(var(--gold-hi),var(--gold));color:var(--ink);cursor:pointer;border-radius:3px}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--gold-hi)}
.btn.ghost:hover:not(:disabled){background:rgba(242,210,122,.12);filter:none}
.mute{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;padding:.3em .8em;font-size:.8rem;
  background:rgba(28,11,34,.85);color:var(--gold-hi);border:1px solid var(--gold);border-radius:3px;cursor:pointer;font-family:var(--font-display);letter-spacing:.08em}

.eyebrow{font-family:var(--font-display);letter-spacing:.22em;font-size:.85rem;color:var(--gold)}
.place{margin-top:14px;font-family:var(--font-display);letter-spacing:.12em;font-size:.82rem;text-transform:uppercase;color:var(--gold)}

/* title */
.title-block{margin-top:22px;display:grid;gap:14px;justify-items:start}
.title-block h1{font-size:clamp(2.3rem,8vw,3.8rem);line-height:1.02;color:var(--gold-hi)}
.title-block .sub{max-width:36em;color:var(--ivory-dim)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.how{display:grid;gap:6px;max-width:38em;margin-top:6px;padding:14px 16px;border:1px dashed rgba(214,169,59,.5);font-size:.95rem;color:var(--ivory-dim)}
.how b{color:var(--ivory)}

/* dialogue */
.dialog{margin-top:12px;background:var(--porphyry);border:2px solid var(--gold);padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:16px;min-height:170px;align-content:start}
.dialog.nop{grid-template-columns:1fr}
.portrait{width:78px;padding:8px 6px 0;border-radius:40px 40px 4px 4px;background:linear-gradient(var(--porphyry-hi),var(--ink));border:1px solid rgba(214,169,59,.5);overflow:hidden}
.portrait svg{display:block;width:100%;height:auto}
.dialog .who{font-family:var(--font-display);letter-spacing:.1em;color:var(--gold-hi);font-size:1.05rem}
.dialog .text{margin-top:6px;min-width:0;font-size:1.08rem}
.dialog .text.narr{font-style:italic;color:var(--ivory-dim)}
.note-label{font-family:var(--font-display);letter-spacing:.2em;font-size:.8rem;color:var(--gold);text-transform:uppercase}
.note-body{margin-top:6px;color:var(--ivory)}
.dialog .go{grid-column:1/-1;justify-self:end;margin-top:6px}
.choices{grid-column:1/-1;display:grid;gap:8px;margin-top:8px}
.choices .btn{text-align:left;text-transform:none;letter-spacing:.02em;font-size:1rem}
@media (max-width:480px){.portrait{width:58px}.dialog{padding:14px;gap:12px}}

/* battle */
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.bhead h2{font-size:1.15rem;color:var(--gold-hi)}
.bhead .round{font-family:var(--font-display);letter-spacing:.14em;font-size:.8rem;color:var(--ivory-dim);text-transform:uppercase}
.hud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:10px}
.order{display:flex;align-items:center;gap:5px;min-width:0;flex-wrap:wrap}
.olabel,.glabel{font-family:var(--font-display);letter-spacing:.14em;font-size:.72rem;text-transform:uppercase;color:var(--ivory-dim);margin-right:4px}
.ord{display:block;width:28px;height:32px;overflow:hidden;border-radius:14px 14px 3px 3px;border:1px solid rgba(214,169,59,.5);background:var(--porphyry)}
.ord.foe{border-color:rgba(179,38,58,.8);background:#3a1520}
.ord.cur{outline:2px solid var(--gold-hi);outline-offset:1px}
.ord svg{display:block;width:100%;height:100%}
.gauge{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:160px}
.gauge .bar{flex:1;margin:0;min-width:80px}
.bar.g i{background:linear-gradient(90deg,var(--gold),var(--gold-hi))}
.gauge.full .bar{box-shadow:0 0 8px var(--gold-hi);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 14px var(--gold-hi)}}

.arena{position:relative;overflow:hidden;border:2px solid var(--gold);padding:14px 12px;display:grid;gap:16px}

/* tactical encounter objective */
.objective{margin:0 0 12px;padding:12px 14px;background:linear-gradient(110deg,rgba(77,42,92,.96),rgba(28,11,34,.96));border:1px solid rgba(214,169,59,.8);box-shadow:inset 0 0 0 1px rgba(242,210,122,.08);display:grid;gap:7px}
.objective-head,.objective-foot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.objective-head b{font-family:var(--font-display);letter-spacing:.06em;color:var(--gold-hi);font-size:.92rem}
.objective-head span{font-size:.78rem;color:var(--ivory-dim);text-transform:uppercase;letter-spacing:.08em}
.objective-track{height:10px;border:1px solid rgba(214,169,59,.45);background:rgba(0,0,0,.45);overflow:hidden}
.objective-track i{display:block;height:100%;background:linear-gradient(90deg,#5d9b64,#a6d47b);transition:width .3s}
.objective.critical .objective-track i{background:linear-gradient(90deg,#8a2b2b,#e0775f)}
.objective-foot{font-size:.78rem;color:var(--ivory-dim);font-variant-numeric:tabular-nums}
.objective p{font-size:.9rem;margin:0;color:var(--ivory)}
.objective p b{color:var(--gold-hi)}
@media(max-width:480px){.objective{padding:10px}.objective-head b{font-size:.83rem}.objective-foot{gap:3px}}
.arena .bg{position:absolute;inset:0}
.arena .bg svg{display:block;width:100%;height:100%}
.arena .shade{position:absolute;inset:0;background:linear-gradient(rgba(28,11,34,.25),rgba(28,11,34,.7))}
.arena>section{position:relative;z-index:1}
.arena.shake{animation:shake .35s}
.foes,.party{display:grid;gap:10px}
.foes{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.party{grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}
.unit{position:relative;min-width:0;padding:10px 8px;text-align:center;background:linear-gradient(rgba(77,42,92,.93),rgba(51,23,63,.93));
  border:1px solid rgba(214,169,59,.45);border-radius:46px 46px 6px 6px}
.unit.foe{background:linear-gradient(rgba(69,25,42,.93),rgba(38,16,26,.93));border-color:rgba(179,38,58,.65)}
.unit .fig svg{display:block;width:100%;max-width:60px;height:auto;margin:0 auto}
.unit.big .fig svg{max-width:82px}
.unit .uname{font-family:var(--font-display);letter-spacing:.04em;font-size:.92rem;margin-top:4px;overflow-wrap:anywhere}
.unit .role{font-size:.74rem;color:var(--ivory-dim);font-style:italic}
.bar{height:6px;margin-top:6px;border-radius:3px;background:rgba(0,0,0,.5);overflow:hidden}
.bar i{display:block;height:100%;transition:width .35s}
.bar.hp i{background:var(--hp)}
.bar.mp i{background:var(--mp)}
.foe .bar.hp i{background:var(--foe-hp)}
.unit small{display:block;font-size:.76rem;color:var(--ivory-dim);font-variant-numeric:tabular-nums}
.wk{font-size:.7rem;color:var(--gold-hi);letter-spacing:.03em;min-height:1em}
.wk.rs{color:var(--ivory-dim)}
.badges{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:1.2rem;margin-top:4px}
.badges span{font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;padding:0 5px;border:1px solid var(--gold);color:var(--gold-hi)}
.badges span.warn{border-color:var(--crimson);background:var(--crimson);color:var(--ivory)}
.badges span.s-burn{border-color:#f08a2a;color:#f6b26b}
.badges span.s-poison{border-color:#7fc47f;color:#a6e0a6}
.badges span.s-stun{border-color:var(--gold-hi);background:rgba(242,210,122,.2)}
.badges span.s-weak{border-color:#b58ad0;color:#d2b3e6}
.unit.dead{opacity:.35;filter:grayscale(1)}
.unit.foe.dead{opacity:0;visibility:hidden}
.unit.dying{animation:dying .7s ease-in forwards}
@keyframes dying{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(14px) scale(.92)}}
.unit.ally.dying{animation:dyingA .7s ease-in forwards}
@keyframes dyingA{from{opacity:1;filter:none}to{opacity:.35;filter:grayscale(1)}}
.unit.active{border-color:var(--gold-hi);box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(242,210,122,.45)}
.unit.targetable{cursor:pointer;outline:2px dashed var(--gold-hi);outline-offset:2px}
.unit.targetable:hover{background:linear-gradient(rgba(106,58,124,.95),rgba(77,42,92,.95))}
.unit.hit{animation:shake .3s}
.unit.lunge-a{animation:lungeA .38s ease-out}
.unit.lunge-f{animation:lungeF .38s ease-out}
@keyframes lungeA{40%{transform:translateY(-16px)}}
@keyframes lungeF{40%{transform:translateY(16px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.panel{margin-top:14px;padding:14px;background:var(--porphyry);border:2px solid var(--gold);min-height:132px;display:grid;gap:10px;align-content:start}
.prompt{font-size:1.05rem}
.prompt small{color:var(--ivory-dim);font-size:.85rem;margin-left:6px}
.prompt.dim{color:var(--ivory-dim);font-style:italic}
.cmds{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left}
.row small{grid-column:1/-1;font-family:var(--font-body);letter-spacing:0;font-size:.85rem;color:var(--ivory-dim)}
.row .cost{font-variant-numeric:tabular-nums}
.log{margin-top:12px;padding:10px 14px;border:1px dashed rgba(214,169,59,.45);min-height:8.4em}
.log p{margin:2px 0}
.log p.old{color:var(--ivory-dim)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.pop{position:absolute;transform:translateX(-50%);font-family:var(--font-display);font-size:1.5rem;color:var(--ivory);
  text-shadow:0 0 3px var(--ink),0 0 3px var(--ink),0 2px 0 var(--crimson);animation:rise 1s ease-out forwards}
.pop.crit{color:var(--gold-hi);font-size:2rem}
.pop.heal{color:#9be5a4;text-shadow:0 0 3px var(--ink),0 0 3px var(--ink)}
.pop.mp{color:#9bc2ff;text-shadow:0 0 3px var(--ink),0 0 3px var(--ink)}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-52px);opacity:0}}
.vfx{position:absolute;width:84px;height:84px;transform:translate(-50%,-50%)}
.vfx::before,.vfx::after{content:'';position:absolute;inset:0}
.vfx.slash::before{inset:auto 0 auto 0;top:48%;height:5px;background:linear-gradient(90deg,transparent,var(--gold-hi),#fff,transparent);
  transform:rotate(-38deg) scaleX(0);animation:slash .4s ease-out forwards}
.vfx.slash::after{inset:auto 0 auto 0;top:48%;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);
  transform:rotate(38deg) scaleX(0);animation:slash .1s .1s ease-out forwards}
.vfx.pierce::before{inset:-20px auto -20px 50%;width:4px;background:linear-gradient(transparent,#fff,var(--gold-hi),transparent);
  transform:translateY(-60px);opacity:0;animation:pierce .35s ease-in forwards}
.vfx.fire::before{background:radial-gradient(circle at 50% 75%,#fff2b0 0,#ffb13b 25%,#f0702a 50%,transparent 72%);animation:flame .85s ease-out forwards}
.vfx.fire::after{background:radial-gradient(circle at 30% 60%,#ff9a3b 0,transparent 40%),radial-gradient(circle at 70% 55%,#ffd36b 0,transparent 38%);animation:flame .85s .12s ease-out forwards;opacity:0}
.vfx.heal::before{border:3px solid #9be5a4;border-radius:50%;animation:ring .8s ease-out forwards}
.vfx.heal::after{border:2px solid #d6ffd9;border-radius:50%;animation:ring .8s .2s ease-out forwards;opacity:0}
.vfx.buff::before{border:3px solid var(--gold-hi);border-radius:50%;animation:ring .8s ease-out forwards}
.vfx.poison::before{background:radial-gradient(circle,rgba(127,196,127,.9) 0,rgba(60,140,80,.5) 45%,transparent 70%);animation:flame .9s ease-out forwards}
.vfx.smoke::before{background:radial-gradient(circle,rgba(200,200,210,.85) 0,rgba(120,120,135,.5) 45%,transparent 72%);animation:puff .9s ease-out forwards}
.vfx.stun::before{border:3px dotted var(--gold-hi);border-radius:50%;animation:spin 1s linear forwards}
@keyframes slash{0%{transform:rotate(-38deg) scaleX(0);opacity:1}60%{transform:rotate(-38deg) scaleX(1);opacity:1}100%{transform:rotate(-38deg) scaleX(1);opacity:0}}
@keyframes pierce{0%{transform:translateY(-60px);opacity:1}70%{transform:translateY(10px);opacity:1}100%{transform:translateY(10px);opacity:0}}
@keyframes flame{0%{transform:translateY(8px) scale(.5);opacity:0}30%{opacity:1}100%{transform:translateY(-14px) scale(1.25);opacity:0}}
@keyframes ring{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes puff{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes spin{0%{transform:rotate(0) scale(.7);opacity:1}100%{transform:rotate(360deg) scale(1.1);opacity:0}}

/* camp */
.camp-head{margin-top:16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 18px}
.camp-head h2{font-size:1.5rem;color:var(--gold-hi)}
.goldbar{font-family:var(--font-display);letter-spacing:.1em;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.camp-note{margin-top:6px;color:var(--ivory-dim)}
.shop,.eq{margin-top:16px;border:2px solid var(--gold);background:var(--porphyry);padding:14px}
.shop h3,.eq h3{font-size:1.05rem;color:var(--gold-hi);margin-bottom:6px}
.shoprow{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(214,169,59,.25)}
.shoprow:last-child{border-bottom:0}
.shoprow small{display:block;color:var(--ivory-dim);font-size:.86rem}
.shoprow .price{font-variant-numeric:tabular-nums;color:var(--gold-hi);margin-right:8px;white-space:nowrap}
.shoprow .buy{display:flex;align-items:center}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.eqcard{padding:10px;border:1px solid rgba(214,169,59,.4);background:var(--ink);min-width:0}
.eqcard .eqname{font-family:var(--font-display);letter-spacing:.05em;color:var(--gold-hi)}
.eqcard .stats{font-size:.82rem;color:var(--ivory-dim);font-variant-numeric:tabular-nums}
.eqcard label{display:grid;gap:2px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-top:8px}
select{background:var(--porphyry);color:var(--ivory);border:1px solid var(--gold);padding:6px;border-radius:3px;max-width:100%;min-width:0}

/* field manual, difficulty and camp training */
.difficulty-box{display:grid;gap:5px;max-width:34em;padding:12px 14px;border:1px solid rgba(214,169,59,.45);background:rgba(77,42,92,.25)}
.difficulty-box label{font-family:var(--font-display);letter-spacing:.1em;color:var(--gold-hi);font-size:.82rem}
.difficulty-box select{width:100%;padding:8px}
.difficulty-box small{color:var(--ivory-dim)}
.manual-section{margin-top:16px}
.manual-section>h2{font-size:1.3rem;color:var(--gold-hi);margin-bottom:8px}
.manual-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:10px}
.manual-card{padding:12px;border:1px solid rgba(214,169,59,.45);background:var(--porphyry);min-width:0}
.manual-card h3{font-size:1rem;color:var(--gold-hi);margin-bottom:5px}
.manual-card p{color:var(--ivory-dim);font-size:.92rem}
.manual-card ul{padding-left:18px;margin:7px 0 0}
.manual-card li{margin:4px 0;font-size:.9rem}
.manual-card small{color:var(--ivory-dim)}
.manual-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.manual-tags span{font-size:.72rem;border:1px solid rgba(214,169,59,.55);padding:2px 6px;color:var(--gold-hi)}
.training-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.training-card{padding:12px;border:1px solid rgba(214,169,59,.4);background:var(--ink);display:grid;align-content:start;gap:8px}
.training-card h4{font-family:var(--font-display);font-weight:400;color:var(--gold-hi);margin:0;letter-spacing:.04em}
.training-card p{font-size:.9rem;color:var(--ivory-dim)}
.training-card .btn{justify-self:start}
/* result screens */
.result{margin-top:18px;display:grid;gap:14px;justify-items:start}
.result h1{font-size:clamp(2rem,7vw,3rem);color:var(--gold-hi)}
.result .lede{max-width:36em;color:var(--ivory-dim)}
.roster{display:grid;gap:6px;width:100%;max-width:32em;font-variant-numeric:tabular-nums}
.roster div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid rgba(214,169,59,.25)}
.roster span:last-child{color:var(--ivory-dim);text-align:right}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.choices .btn{display:grid;gap:4px;justify-items:start}
.choices .clabel{font-family:var(--font-display);letter-spacing:.04em}
.choices .gain{font-family:var(--font-body);letter-spacing:0;font-size:.88rem;line-height:1.3;color:var(--ivory-dim);text-transform:none;text-align:left}
.choices .btn:hover .gain{color:var(--ivory)}
.stage.slim{aspect-ratio:10/1.9}
.tabbar{position:sticky;top:0;z-index:30;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 0;padding:8px 6px;background:rgba(28,11,34,.97);border-bottom:2px solid var(--gold)}
.tab{font-family:var(--font-display);letter-spacing:.06em;font-size:.88rem;padding:.45em .9em;background:transparent;color:var(--ivory-dim);border:1px solid rgba(214,169,59,.45);border-radius:3px;cursor:pointer;min-height:40px}
.tab.on{background:var(--gold);color:var(--ink);border-color:var(--gold-hi)}
.tabgo{margin-left:auto;min-height:40px;padding:.4em 1em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:.85rem;padding:.35em .8em;background:transparent;color:var(--ivory);border:1px solid rgba(214,169,59,.5);border-radius:14px;cursor:pointer;min-height:36px}
.chip.on{background:rgba(214,169,59,.25);border-color:var(--gold-hi);color:var(--gold-hi)}
.chip small{display:inline;opacity:.7}
.ord{opacity:.6}.ord.cur{opacity:1}.ord.nx{opacity:.95;filter:brightness(1.18);box-shadow:0 0 0 1px rgba(242,210,122,.6)}
.place{display:flex;justify-content:space-between;align-items:center;gap:10px}

var SKN=0;
function waves(y,fill,amp,seg,op){
  amp=amp||8;seg=seg||60;op=op==null?1:op;
  var n=Math.ceil(860/seg),t='';for(var i=0;i<n;i++)t+='t'+seg+' 0 ';
  return '<path d="M-20 '+y+'q'+(seg/2)+' -'+amp+' '+seg+' 0 '+t+'V260H-20Z" fill="'+fill+'" opacity="'+op+'"/>';
}
function stars(n,maxY){var s='';for(var i=0;i<n;i++){var x=(i*97+23)%800,y=(i*53+11)%maxY,r=.8+(i%3)*.45;s+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#f6e7b3" opacity="'+(.45+(i%4)*.12)+'"/>'}return s}

function skCost(id){var k=SKILLS[id];return k.cost+(id==='wrath'&&(flags.morality||0)<=-2?5:0)}
function pctTxt(x){return Math.round(x*100)+'%'}
function skillDetail(sk){
  var p=[],rounds;
  if(sk.hits)p.push('Strikes '+sk.hits+' times at '+pctTxt(sk.mult)+' power ('+ELNAME[sk.el]+'), each at a random foe.');
  else if(sk.mult)p.push((sk.tgt==='all'?'Hits every foe':'Hits one foe')+' for '+pctTxt(sk.mult)+' power ('+ELNAME[sk.el]+').');
  else if(sk.tgt==='all'&&sk.weak)p.push('Targets every foe.');
  if(sk.burn)p.push('Burns for '+sk.burn+' rounds (8 damage each round).');
  if(sk.poison)p.push('Poisons for '+sk.poison+' rounds (6 damage each round).');
  if(sk.weak)p.push('Weakens: −30% defence for '+sk.weak+' rounds.');
  if(sk.stun)p.push('Stuns for '+sk.stun+' round (bosses resist).');
  if(sk.drain)p.push('Heals the user for '+pctTxt(sk.drain)+' of the damage dealt.');
  if(sk.recoil)p.push('Costs '+pctTxt(sk.recoil)+' of the user’s max HP.');
  if(sk.healPct)p.push('Heals one companion for '+pctTxt(sk.healPct)+' of their max HP'+(sk.cleanse?' and removes every ailment.':' and cures poison.'));
  if(sk.healAllPct)p.push('Heals the whole company for '+pctTxt(sk.healAllPct)+' of max HP'+(sk.cleanse?' and removes every ailment.':'.'));
  if(sk.buff)p.push('Whole company: +30% attack for '+sk.buff+' rounds.');
  if(sk.defUp)p.push('Whole company: +30% defence for '+sk.defUp+' rounds.');
  if(sk.guard)p.push('Whole company guards (halves damage) until their next turn.');
  if(sk.selfGuard)p.push('Eirene guards (halves damage until her next turn). The companions on either side of her in the formation get +30% defence for '+sk.adj+' rounds. With a spear equipped she also counters the first foe that strikes her (40% attack).');
  if(sk.gauge)p.push('Adds +'+sk.gauge+' Acclamation.');
  return p.join(' ');
}
Object.keys(SKILLS).forEach(function(k){SKILLS[k].detail=skillDetail(SKILLS[k])});

function addGear(id,name,slot,type,tier,price,st,eff,who){
  var g={name:name,slot:slot,type:type,tier:tier,price:price};
  for(var k in st)g[k]=st[k];
  if(eff)g.effect=eff;if(who)g.who=who;
  var d=[];
  STAT_NAMES.forEach(function(s){if(g[s[0]])d.push('+'+g[s[0]]+' '+s[1])});
  if(g.crit)d.push('+'+Math.round(g.crit*100)+'% critical');
  g.desc=d.join(', ')+(eff?'. '+EFFECT_TEXT[eff]:'');
  GEAR[id]=g;
}

function canEquipId(heroId,gid){
  var g=GEAR[gid],h=HEROES[heroId];if(!g||!h)return false;
  if(g.who&&g.who.indexOf(heroId)<0)return false;
  if(g.slot==='relic')return true;
  return h.can[g.slot].indexOf(g.type)>=0;
}
function canEquip(u,gid){return canEquipId(u.id,gid)}
function usableNames(gid){
  var names=[];party.forEach(function(p){if(canEquip(p,gid))names.push(p.name)});
  return names;
}

}

function mor(n){flags.morality=(flags.morality||0)+n}
function moralLabel(){var m=flags.morality||0;return m>=3?'Merciful':m<=-2?'Ruthless':'Pragmatic'}
function autoEquipUnit(u){
  SLOTS.forEach(function(sl){
    if(u.eq[sl[0]])return;
    var best=null,bs=-1;
    inv.gear.forEach(function(id){
      if(GEAR[id].slot!==sl[0]||!canEquip(u,id)||equippedBy(id)!==-1)return;
      var sc=gearScore(u,id);if(sc>bs){bs=sc;best=id}
    });
    if(best)u.eq[sl[0]]=best;
  });
  clampVitals(u);
}
function recruitEirene(){
  var u=mkUnit(HEROES.eir),L=0,xp=0;
  party.forEach(function(p){if(p.lv>L){L=p.lv;xp=p.xp||0}});
  while(u.lv<L)levelUp(u);
  u.xp=xp;
  if(inv.gear.indexOf('w_boar')<0)inv.gear.push('w_boar');
  if((flags.morality||0)<=-2&&inv.gear.indexOf('w_heirloom')<0){inv.gear.push('w_heirloom');campMsgs.push('Eirene arrives carrying the Heirloom Axe of Phokas, taken from her father’s own strongroom. Your hard road has made her conflicted: Wrath of Nicaea now costs +5 MP.')}
  party.splice(Math.min(1,party.length),0,u);
  autoEquipUnit(u);
  fullHeal(u);
}
function retireHaraldr(){
  for(var i=0;i<party.length;i++){if(party[i].id==='har'){party.splice(i,1);break}}
  if(inv.gear.indexOf('w_hildr')<0)inv.gear.push('w_hildr');
  flags.haraldrDead=true;
}
function hasSmbat(){return party.some(function(p){return p.id==='smb'})}
function recruitSmbat(){
  var u=mkUnit(HEROES.smb), L=party[0].lv;
  while(u.lv<L)levelUp(u);
  u.xp=party[0].xp||0;
  fullHeal(u);party.push(u);
}

    ['Symeon','Basil carried sixty-seven winters and a dozen wars. Such men rarely end so quietly.'],
    ['Courier','There is one thing more. The imperial physician, Stephanos, was sent to a monastery within a day of the death. He smuggled this to me. It is for you, and for no one else.'],
    ['Symeon','Stephanos. My old master. He describes weeks of cramp, a numb tongue, a slow heart. Blue monkshood, aconite from the eastern markets. A little in the evening wine looks very like old age.'],
    ['Theodoros','Then someone wanted the fleet to sail without its Emperor. Or not to sail at all.'],
    ['Haraldr','Court rats. They feared a man who broke landlords and paid soldiers.'],
    ['Nikephoros','The recall order says come home. Very well. We go home, and we go quietly.'],
    ['_note','Basil II died on 15 December 1025 while preparing his Sicilian expedition. The sources record illness, not murder. The poison plot told here is invented. He was succeeded by his brother Constantine VIII, who reigned until 1028.']
  ]),
  C('golden','camp','The Golden Horn, at anchor',SHOP_TIERS.golden),

  /* ===== CHAPTER 6: the vaults ===== */
  S('boucoleon','The Boucoleon Palace, Constantinople · February 1026',[
    ['Narrator','Ice rims the Golden Horn when the dromon slips beneath the sea-wall of the Boucoleon. A palace servant, paid in Reggio silver, opens a postern.'],
    ['Symeon','Stephanos named the cup-bearer. Before he fled, the cup-bearer named his master.'],
    ['Nikephoros','The protovestiarios, Michael. Keeper of the wardrobe, the keys and the vaults.'],
    ['Haraldr','A keeper of robes. I expected a general, at least.'],
    ['Theodoros','The man who holds the keys holds the records. If the ledgers burn, so does the proof.'],
    ['Michael','You are a long way from Reggio, spatharios. I did say to write. You never did. I was so looking forward to your letters.'],
    ['Michael','Do you know what an account is? A promise, written down by someone who expects to be paid. I have kept this Empire’s accounts for thirty years, and I know to the obol what Basil’s Sicily would have cost three provinces. Someone had to count it. I only spared the Empire a war it could not afford.'],
    ['Nikephoros','You spared the landlords a law they did not like.'],
    ['Michael','Call it what you wish. Take them, and let no one leave these vaults with that ledger.'],
    ['Haraldr','At last, a conversation I understand.']
  ]),
  {t:'battle',n:5},
  S('vaults','The Imperial Vaults, Constantinople · February 1026',[
    ['Narrator','Michael sinks against a chest of imperial regalia, his jeweled dagger ringing on the marble. The surviving guards throw down their spears.'],
    ['Michael','Burn it, or take it. Half the court has dined at my table. The new Emperor will not thank you.'],
    ['Symeon','It is all here. Every dose, every payment, every name. Basil’s death is written in a clerk’s tidy hand.'],
    ['Theodoros','He kept receipts for a murder.'],
    ['Michael','A keeper keeps. It is the only virtue I never lost.'],
    ['Symeon','There is an entry for monthly board: “the physician, at the Stoudios.” Stephanos was never exiled. He is being kept.'],
    ['Symeon','Wait. The last leaf is gone. The stub is still in the binding. It was torn out, not cut.'],
    ['Narrator','Where the final page should be, a single scrap of wax clings to the stub: a walled town beside a lake, and one word pressed around its rim: NIKAIA.'],
    ['Nikephoros','Whose seal is this?'],
    ['Michael','Did you think a keeper keeps for himself, spatharios? I kept for a master who pays better than Emperors. The page you want is no longer in this room. The seal is all I could not bring myself to burn. Call it pride.'],
    ['Haraldr','He is still smiling. I dislike that. I would like it to stop.'],
    ['Nikephoros','Constantine wears the purple now, and the court is watching these doors. We hold a ledger without its last page, and a seal. What do we do with them?'],
    ['_choice',{prompt:'How do you carry the ledger out?',opts:[
      {label:'Lay it before Emperor Constantine in private',gain:'The pragmatic road. The new Emperor sends 100 gold in discreet thanks, and the court is purged quietly. The master behind the missing page is left unnamed for now.',m:-1,reply:['Nikephoros','Let the Basileus judge his own household. We have done what we swore to do.'],fx:function(){flags.verdict='crown';inv.gold+=100;mor(-1)}},
      {label:'Read it aloud before the Senate and the people',gain:'The idealist’s road. Gain 2 Bread and 1 Theriac from the grateful crowd, and their trust: every later story battle starts with +15 Acclamation. The court’s hatred follows you.',m:1,reply:['Theodoros','Then the whole city will know by nightfall. I hope the doors are strong.'],fx:function(){flags.verdict='public';flags.crowd=true;inv.bread+=2;inv.theriac+=1;mor(1)}},
      {label:'Follow the payments to Nicaea',gain:'The road the story was always walking. You skip the politics and move before the trail goes cold: the ambush at Chrysopolis starts with its foes at 85% HP.',reply:['Symeon','A seal is a trail. Trails go cold, spatharios. The ledger can wait one more week to be read.'],fx:function(){flags.verdict='nicaea'}}
    ]}]
  ]),
  S('fire','The Imperial Vaults, Constantinople · February 1026',[
    ['Michael','So be it. Carry it out, then. All of you. (a dry laugh) I did not say you would carry it out together.'],
    ['Narrator','Michael’s hand finds a bronze ring set in the floor, and he pulls. Far above, sluice-gates grind open. Lamp-oil, stored for the palace lanterns, pours down channels cut into the vault ceiling. The brazier tips. Fire races along the stone gutters toward the stair.'],
    ['Theodoros','That is naphtha. Thirty jars of it, running through the walls. I can smell it from here. Run!'],
    ['Narrator','The iron door of the vault begins to drop from its housing with a sound like a great beast swallowing.'],
    ['Smbat','The gate! If it falls we are sealed in with the fire!'],
    ['Narrator','Haraldr drops his shield, plants both feet, and catches the iron door across his back.'],
    ['Haraldr','Go. All of you. Now, while it is only very heavy.'],
    ['Nikephoros','Haraldr! Drop it! There is another stair!'],
    ['Haraldr','There is no other stair, Niki. I checked. I am very thorough about doors.'],
    ['Symeon','I will not leave you under a gate!'],
    ['Haraldr','Monk. Listen. I do not want a bed and a priest and a cough. I told the old gods I wanted a door and a good reason. They have outdone themselves.'],
    ['Theodoros','The oil. If I seal the channel, I can—'],
    ['Haraldr','Engineer, you are the only man I would trust to blow up my funeral. Go and design a better one.'],
    ['Smbat','Haraldr. Brother.'],
    ['Haraldr','Armenian. You shot well. I lied about being modest, so did you. Carry that ledger like a man carries his mother’s cross.'],
    ['Haraldr','And you, Armenian, when this is over, ask for that cross back. Ask nicely. He is a soft man under the rank.',function(){return flags.smbat==='merc'}],
    ['Narrator','The iron groans lower. Haraldr is red-faced, shaking, grinning, a man holding up a mountain with a joke.'],
    ['Haraldr','Tell the skalds the Greeks fed me well and the roof leaked. Tell Basil I kept my oath. Go, spatharios. You promised him a clean ledger. Carry it clean.'],
    ['Narrator','He tears Hildr from his belt and sends her skidding across the marble to Nikephoros’s feet. A small carved wooden horse slides from his pouch and skitters after her.'],
    ['Haraldr','Give her to someone who will talk to her. She likes being talked to. The horse is for a boy in Kiev. Tell him bravery is easy. You are scared, and then you do it anyway, and afterwards you are hungry.'],
    ['Narrator','The company runs. Behind them the iron groans, holds for one long breath, and a roar of flame swallows the vault. From inside, faint and wildly off-key, someone is singing a very rude drinking song in Old Norse.'],
    ['Narrator','Then the song stops.']
  ]),
  {t:'do',fn:function(){retireHaraldr()}},
  S('boucoleon','The sea-wall postern, Constantinople · Dawn, February 1026',[
    ['Narrator','The company stands at the postern in the first grey light, ash on their faces, one fewer than they came with. Nikephoros holds a Norse axe that is far too heavy for him.'],
    ['Theodoros','I keep counting five of us. I keep getting the number wrong.'],
    ['Smbat','He owed me a wager. I will collect it from the first Norseman I meet, and it will not be the same.'],
    ['Nikephoros','He died where he wanted to. At a door, holding something heavy, saying something clever.'],
    ['Symeon','That does not make it lighter, spatharios. Eternal be his memory.'],
    ['Narrator','You hand the ledger to Constantine’s chamberlain, as you decided. He thanks you, takes the ledger, and asks you to forget the door. Four courtiers are arrested the next morning without explanation.',function(){return flags.verdict==='crown'}],
    ['Narrator','The ledger is read in the Senate and in the squares. The crowd cheers Basil’s name and demands heads. Constantine’s guards keep them from the Boucoleon, and a dozen courtiers flee across the water before noon.',function(){return flags.verdict==='public'}],
    ['Narrator','You do not wait for the Emperor’s thanks. By dusk you have left the ledger in the abbot’s keeping and the tide is already turning for the Asian shore.',function(){return flags.verdict==='nicaea'}],
    ['Symeon','A ledger with its last page missing closes nothing. Michael is dead, and the hand that bought him is not.'],
    ['Theodoros','Stephanos is still alive, and still locked in a cell. The board bill says the Stoudios.'],
    ['Nikephoros','Then we begin with the old man. And then we cross the water.'],
    ['_note','The imperial vault complex under the Boucoleon is invented. The Boucoleon palace itself was real: it stood on the sea-wall of the Great Palace and had its own harbour and landing stage on the Sea of Marmara.']
  ]),

  /* ===== CHAPTER 7: the Monastery of Stoudios ===== */
  S('stoudios','Monastery of Stoudios, Constantinople · February 1026',[
    ['Narrator','PART TWO. The ledger had a last page. Somewhere, someone still holds it, and the man who tore it out never meant it to be found.'],
    ['Narrator','The Stoudios stands by the Golden Gate, its bell-tower grey against a pearl dawn. The abbot meets the company at the gate with a lantern and the expression of a man who has been lying for a living.'],
    ['Abbot','We were told the physician was a madman, kept for his own good. We were paid to believe it. I am ashamed to say we believed it very efficiently.'],
    ['Narrator','In a cell beneath the scriptorium an old man sits with a blanket around his shoulders and ink on his fingers. When the door opens he squints, and then he begins to weep.'],
    ['Symeon','Master. Stephanos.'],
    ['Stephanos','Symeon? My best pupil, who once dosed my soup with senna to test my pulse. I told you then, and I tell you now: a physician should never be that clever.'],
    ['Symeon','I thought you dead, or in exile.'],
    ['Stephanos','Neither. Filed. Michael had a column for me, and a line in his book.'],
    ['Stephanos','I told the court on the second day that it was aconite. By the third day I was here. The cup-bearer bought the monkshood from an apothecary on the Mese, and before they took me I made the apothecary talk.'],
    ['Nikephoros','Who paid him?'],
    ['Stephanos','Silver, new-struck, stamped with a seal. A walled town beside a lake, and a word around the rim: NIKAIA. The silver came out of a great house across the water. The estate of Bardas Phokas.'],
    ['Smbat','The Phokades. Basil crushed that family in his youth.'],
    ['Stephanos','Crushed. Not ended. Basil’s law of 996 would give back what the great houses swallowed, and Bardas has swallowed more than anyone: half of Bithynia. A Sicilian war meant new taxes and an inspector’s eye on every estate. A dead Emperor meant neither.'],
    ['Nikephoros','So he bought an Emperor’s death, a physician’s silence and a keeper’s ledger, to protect his farms.'],
    ['Stephanos','Not his farms. Other people’s. Three hundred villages, by my last count.'],
    ['Stephanos','There is a daughter. Eirene. She keeps the Bithynian estates and signs the silver. I do not know whether that makes her guilty or used. She is the only one who can tell you which. Be careful of her, Symeon’s friends. She is her father’s daughter, and that may be an honour or a warning.'],
    ['Symeon','We lost one of ours in the vaults. A Norseman. He held a door so the rest of us could leave.'],
    ['Stephanos','Then I will add him to the names I am writing down. In the margin, in red, where a ledger cannot ignore him.'],
    ['Symeon','Master, come away with us.'],
    ['Stephanos','I am too old to cross water. I shall stay and write down everything I remember, in a hand even Michael could not burn.'],
    ['_note','The Stoudios monastery was real. It stood near the Golden Gate and was famous for its scriptorium and its strict rule, and its monks were prominent in the religious politics of the capital. Physician Stephanos and this cell are invented.']
  ]),
  C('stoudios','stoudios','The Stoudios guesthouse',SHOP_TIERS.stoudios),

  /* ===== CHAPTER 8: Chrysopolis ===== */
  S('chrysopolis','The Bosphorus crossing · Dawn, February 1026',[
    ['Narrator','A fisherman ferries the company across the strait in a boat that smells of last week’s catch. Constantinople shrinks behind them. Ahead, the Asian shore is flat, grey and entirely too quiet.'],
    ['Theodoros','I have now been on a warship, a corsair galley, and this. The smell is the only consistent element.'],
    ['Smbat','The quay at Chrysopolis is empty at dawn. A working quay is never empty at dawn.'],
    ['Theophylact','Spatharios! You have crossed to the wrong shore for your health. Lord Bardas sends his compliments, and his spears.'],
    ['Nikephoros','Theodoros.'],
    ['Theodoros','Light what?'],
    ['Nikephoros','You know what.']
  ]),
  {t:'battle',n:6},
  S('chrysopolis','The quays of Chrysopolis · February 1026',[
    ['Narrator','A boar-spear thuds into the planks, point first, and hums. On the warehouse roof a woman in a hooded brown cloak lowers a second spear and swings down: boots, a chestnut braid, ink on her fingers like Symeon’s.'],
    ['Eirene','Don’t stop on my account. I was enjoying watching someone else do my work.'],
    ['Nikephoros','Who are you?'],
    ['Eirene','Eirene Phokaina, steward of the Bithynian estates, and if you believe the men you just fought, my father’s daughter.'],
    ['Eirene','I have followed three of his clerks since Epiphany. They crossed the Bosphorus with sacks of silver and came back without them. My seal was on every receipt. I never put it there.'],
    ['Symeon','Stephanos said your seal signed the apothecary’s silver.'],
    ['Eirene','Stephanos is right. My father had a copy cut. When I found out I went to his study with a boar spear and a very reasonable tone of voice. He told me I should be proud: I had paid for the quietest murder in the history of the Empire.'],
    ['Nikephoros','And you came to us.'],
    ['Eirene','I came to the first people who looked at that quay and knew exactly what was wrong with it. You are a ledger-keeper with a sword. I am a ledger-keeper with a spear. We should compare notes.'],
    ['Eirene','That is a Rus axe at your belt. Whose?'],
    ['Nikephoros','A friend’s. He died holding a door.'],
    ['Eirene','Then it has been well carried.'],
    ['Theodoros','Another one who speaks in complete sentences. We are becoming a seminar.'],
    ['Eirene','My father keeps the ledgers at Nicaea. He is there now, or will be until he hears about this quay. Then he will run east to the Phokas castles, where the Emperor’s writ grows thin.'],
    ['Nikephoros','Then we reach Nicaea before he runs.'],
    ['Eirene','I know a road that is not on any map. I laid half of it myself.']
  ]),
  {t:'do',fn:function(){recruitEirene()}},

  /* ===== CHAPTER 9: the estate at Nicaea ===== */
  S('nicaea','The estates of Nicaea, Bithynia · March 1026',[
    ['Narrator','Bithynia in March: olive terraces stepping down to Lake Ascania, the old walls of Nicaea pale on the water. Eirene’s stride slows when the Phokas villa comes into view.'],
    ['Eirene','I learned to read on that terrace. I learned what a debt is on that threshold.'],
    ['Steward','Lady Eirene! Your father left before dawn with half the household, east to the castles. He said you would come.'],
    ['Eirene','Kallistos. Where are the ledgers?'],
    ['Steward','In the strongroom, where you taught me to keep them. He told me to burn them. I have been very slow at lighting fires.'],
    ['Smbat','Slow fires. I like him.'],
    ['Narrator','The strongroom is a stone cellar lined with leather ledgers: tenancies, forged deeds, widows’ debts. On a shelf of its own lies a box of letters, all sealed with the walled town on the lake. They are payments to “the Keeper”. They are complaints about the Sicilian war tax. And one, in Bardas’s own hand: “Stop the fleet by Yusuf. If Yusuf fails, stop the Emperor.”'],
    ['Nikephoros','He hired corsairs, bought a physician, poisoned an Emperor, all to protect his farms.'],
    ['Eirene','Not his. Other people’s. Every ledger here is a family that signed away a field for a loaf.'],
    ['Narrator','Above the hearth hangs an old war-axe, its blade darkened by a century of smoke. Eirene lifts it down.'],
    ['Eirene','The Heirloom Axe of Phokas. My great-grandfather’s, from the wars against the Arabs. It was never my father’s to keep.'],
    ['Steward','And the lance by the door, my lady? Your grandfather’s Dory of Nicaea?'],
    ['Eirene','Leave it, Kallistos. Whatever happens to this house, it should not be a trophy.'],
    ['Nikephoros','Eirene, the estate is yours to judge. These ledgers are the proof the law needs. What shall we do with this house?'],
    ['_choice',{prompt:'What becomes of the Phokas estate at Nicaea?',opts:[
      {label:'Seize the ledgers for the law',gain:'The ledgers go to Constantine as proof, and the tenants’ debts are on record. Eirene takes her grandfather’s Dory of Nicaea (a personal spear). The proof speeds the Emperor’s horse: the bridge fight needs one round less.',m:1,reply:['Eirene','Then the debts will be read aloud, one family at a time. Good. It is the only justice a ledger can offer.'],fx:function(){flags.seized=true;inv.gear.push('w_doryN');mor(1)}},
      {label:'Burn the estate and its debt-books',gain:'Gain 150 gold of plunder and 2 Theriac from the cellars. The debts burn too, but so does the proof. The blaze warns Bardas: an extra Phokan horseman joins the bridge fight.',m:-1,reply:['Eirene','That was my home. It was also a prison. I will not thank you, and I will not stop you.'],fx:function(){flags.seized=false;inv.gold+=150;inv.theriac+=2;mor(-1)}}
    ]}],
    ['Narrator','Smoke rises over the olive terraces long before the company has left the valley.',function(){return flags.seized===false}],
    ['Narrator','The ledgers go north under Smbat’s saddle, wrapped in an oilskin and a promise.',function(){return flags.seized===true}],
    ['_note','The Phokas family was real and powerful: Bardas Phokas the Younger rebelled against Basil II in 987–989 and died in battle. Basil’s 996 law tried to undo the great landowners’ land grabs. The Bardas of this tale, his estate at Nicaea and his daughter Eirene are invented.']
  ]),
  {t:'do',fn:function(){}},
  C('nicaea','nicaea','Camp above Nicaea',SHOP_TIERS.nicaea),
  S('nicaea','The terrace above Nicaea · Night, March 1026',[
    ['Narrator','The company sleeps in the lee of a terrace wall. Only two figures are awake: a spatharios turning a heavy Norse axe over in his hands, and a steward with a lantern and nothing to count.'],
    ['Eirene','You touch that axe the way my father touches the keys of his strongroom. But you are not guarding it. You are asking it something.'],
    ['Nikephoros','Whether I should have stayed with him. Whether there was another stair.'],
    ['Eirene','Was there?'],
    ['Nikephoros','No. He checked. He was very thorough about doors.'],
    ['Eirene','Then he did not die for a ledger, Nikephoros. He died for four people he had decided to keep. You are one of them. It is rude to waste a gift like that on guilt.'],
    ['Nikephoros','I have been told that before. Not so plainly.'],
    ['Eirene','I am a steward. I have never learned any other way to say a thing.'],
    ['Narrator','She hangs the lantern on a branch of an olive tree older than the Phokas name. For a while neither of them speaks, and neither of them minds.'],
    ['Eirene','Whatever the bridge brings, I would like to see you on the far side of it.'],
    ['Nikephoros','That is the only plan I have ever liked.']
  ]),

  /* ===== CHAPTER 10: the Sangarios bridge ===== */
  S('bridge','The Sangarios River, Bithynia · March 1026',[
    ['Narrator','Scouts come in at dusk. Bardas has gone east at a gallop with his household guard, and he is making for the old bridge of Justinian over the Sangarios. Beyond it lie Anatolia and the Phokas castles.'],
    ['Eirene','The bridge is one carriageway wide. Whoever holds it holds the road to Cappadocia.'],
    ['Nikephoros','And Constantine’s horse?'],
    ['Eirene','If the ledgers reached the capital, the marshals are a short march behind us. We hold the bridge until they arrive.',function(){return flags.seized===true}],
    ['Eirene','Without the ledgers the marshals follow on rumour, and rumour marches slowly. We hold the bridge for as long as it takes.',function(){return flags.seized===false}],
    ['Smbat','A bridge. A narrow bridge. Archers behind it. I am almost happy.'],
    ['Theodoros','I will prepare something unnecessary.'],
    ['Symeon','Someone should say a prayer. I will do it quietly, so no one is embarrassed.'],
    ['Narrator','At dawn the Phokas household thunders onto the bridge, and a grey-bearded man in a red cloak reins in at its mouth. He looks at his daughter for a long moment.'],
    ['Bardas','You carry the spear I gave you against the man who gave it.'],
    ['Eirene','You gave me a seal as well, Father. And then you copied it.'],
    ['Bardas','To you, Spatharios, I will make an offer, because you are plainly a man who counts. I will make you strategos of Thrace, with a house at Nicaea and silver enough to put a statue of yourself in every theme. The Empire is a ledger. Someone must be the one who balances it.'],
    ['Nikephoros','I have met your keeper. He balanced it very well. It cost him a door.'],
    ['Bardas','Then I am sorry for you. Take the bridge.']
  ]),
  {t:'battle',n:7},
  S('bridge','The Sangarios Bridge · March 1026',[
    ['Narrator','The imperial horse floods onto the far bank in a line of red and gold. The Phokas household drops its spears, one by one.'],
    ['Narrator','Bardas stands at the parapet with his blade in the water below him and blood on his red cloak. He does not look at the soldiers. He looks at his daughter.'],
    ['Bardas','You will not enjoy it, Eirene. Justice is a very poor meal after the first mouthful.'],
    ['Eirene','I was raised on your table. I know the taste of everything else.'],
    ['Eirene','Whatever you choose, spatharios, choose it knowing I will remember.'],
    ['_choice',{prompt:'What becomes of Bardas Phokas?',opts:[
      {label:'Deliver him to Constantine’s court in chains',gain:'Bardas is judged under the law. Your name is spoken with respect in the provinces.',m:1,reply:['Nikephoros','Take him to the Emperor, bound and alive. The law will be the one to name him.'],fx:function(){flags.bardas='law';mor(1)}},
      {label:'End it on the bridge',gain:'Swift and final. No trial can embarrass the court, and no testimony can name its friends. The provinces fear your sword.',m:-1,reply:['Nikephoros','There will be no trial. There are too many people in this valley who owe him a favour.'],fx:function(){flags.bardas='bridge';mor(-1)}}
    ]}]
  ]),
  {t:'do',fn:function(){var m=flags.morality||0;flags.ending=m>=3?'good':m<=-2?'evil':'neutral'}},

  /* ===== EPILOGUES ===== */
  S('nicaea','The estates of Nicaea · Spring 1026',[
    ['Narrator','By May the first carts leave Nicaea. The Emperor Constantine, shown Bardas’s ledgers beside Stephanos’s testimony, is shamed into enforcing the law his brother wrote in 996. The Phokas deeds are void. The farms go back to the villages that tilled them.'],
    ['Eirene','Three hundred and eleven villages. I counted. I would like to count them again every spring, just to be sure.'],
    ['Narrator','Constantine names Eirene steward of the confiscated estates, under the law and not the lords. She tears her father’s debt-books across the same threshold where she learned what debt was.'],
    ['Symeon','I am staying at the Stoudios. Stephanos needs a pair of hands, and the city needs a physician who says “wait for the second day” when the court says “old age”.'],
    ['Theodoros','I am staying too, as the Empire’s least reliable engineer. Someone has to supervise the fireworks on the Emperor’s name-day.'],
    ['Smbat','Brother, I will ride with you when you ride, and drink with you when you stay. Paid on time, with interest. I am almost speechless.',function(){return flags.smbat==='brother'}],
    ['Smbat','Contract fulfilled, spatharios, and paid on time. Here is your cross back. If you ever ask me again, ask it as a brother.',function(){return flags.smbat==='merc'}],
    ['Eirene','The law needs an inspector who cannot be bought. I have the estates. I do not have the inspector.'],
    ['Nikephoros','The Emperor will want me elsewhere.'],
    ['Eirene','Emperors want everything elsewhere. Stay a season. Stay a harvest.'],
    ['Nikephoros','A harvest.'],
    ['Narrator','He stays a harvest. Some say he stays longer. Over the door of the Nicaea granary hangs a Norse axe named Hildr, where any hungry farmer can see it from the road. Nobody remembers who put it there. Everybody says the same thing as they pass: “He picked a door.”']
  ].map(function(l){return l.length===2&&false?l:l}).filter(function(l){return true}).map(function(l){var f=l[2];return [l[0],l[1],function(){return flags.ending==='good'&&(!f||f())}]})),
  S('palace','The Great Palace, Constantinople · Spring 1026',[
    ['Narrator','Constantine is a tired man, and tired men reward quiet. He reads the Phokas ledgers by candlelight and decides that a law enforced loudly is a law resisted.'],
    ['Narrator','Over the next years the Phokas deeds are voided one village at a time. Nobody celebrates. Nobody burns. It is slow, and it moves, which is more than the Empire usually manages.'],
    ['Eirene','I will keep the estates under the Emperor’s seal and the ledgers under mine. We should talk, spatharios, once the dust settles. In a year, perhaps. I will be at Nicaea, counting.'],
    ['Nikephoros','I will write.'],
    ['Eirene','Write on time. I count.'],
    ['Symeon','I shall stay with Stephanos for a season, and then I do not know. A physician never knows where the next patient is.'],
    ['Theodoros','I will stay with whoever pays for the spoon. It is a very good spoon.'],
    ['Smbat','I am going east, to look at the mountains of a country that is no longer a country. A man should see that once.'],
    ['Narrator','Each year at the Stoudios the company drinks to a Norseman, and the abbot pretends not to notice the wine count.']
  ].map(function(l){return [l[0],l[1],function(){return flags.ending==='neutral'}]})),
  S('vaults','The Boucoleon Vaults, Constantinople · Spring 1026',[
    ['Narrator','Constantine is a tired man, and tired men reward efficiency. When Nikephoros lays the Phokas ledgers on his desk he does not lay them as evidence. He lays them as inventory.'],

  }catch(e){}

/* ---------- units ---------- */
function gb(u,k){var t=0,e=u.eq;if(e)for(var s in e){var g=e[s]&&GEAR[e[s]];if(g&&g[k])t+=g[k]}return t}
function atkOf(u){return(u.atk+gb(u,'atk'))*(u.buff>0?1.3:1)}
function defOf(u){
  var extra=0;
  if(B&&B.objective&&B.bi===4&&B.objective.id==='command-escort'&&u.key==='admiral')extra=B.foes.filter(function(f){return f.key==='guard2'&&f.hp>0}).length*2;
  return(u.def+gb(u,'def')+extra)*((u.st&&u.st.weak>0)?0.7:1)*(u.dbuff>0?1.3:1)
}
function mhp(u){return u.maxhp+gb(u,'hp')}
function mmp(u){return u.maxmp+gb(u,'mp')}
function spdOf(u){return u.spd+gb(u,'spd')}
function critOf(u){return 0.1+gb(u,'crit')}
function noSt(){return {burn:0,poison:0,stun:0,weak:0}}
function mkUnit(h){var u=clone(h);u.maxhp=u.hp;u.maxmp=u.mp;u.lv=1;u.xp=0;u.buff=0;u.dbuff=0;u.defending=false;u.st=noSt();u.eq={weapon:null,armor:null,relic:null};return u}
var LEVEL_CAP=12;
function xpNeed(lv){return 60+25*(lv-1)}
function levelUp(p){
  var h=HEROES[p.id],g=(h&&h.grow)||{hp:12,mp:4,atk:3,def:2};
  p.lv++;p.maxhp+=g.hp;p.maxmp+=g.mp;p.atk+=g.atk;p.def+=g.def;
  if(p.lv===4||p.lv===7||p.lv===10)p.spd+=1;
  if(p.hp>0){p.hp+=g.hp;p.mp+=g.mp}
  return g;
}
function awardXp(p,amount){
  var from=p.lv;
  if(p.lv>=LEVEL_CAP){p.xp=0;return {from:from,to:p.lv}}
  p.xp=(p.xp||0)+amount;
  while(p.lv<LEVEL_CAP&&p.xp>=xpNeed(p.lv)){p.xp-=xpNeed(p.lv);levelUp(p)}
  if(p.lv>=LEVEL_CAP)p.xp=0;
  return {from:from,to:p.lv};
}
function newSkillsBetween(p,from,to){
  var out=[];
  p.skills.forEach(function(id){var l=SKILLS[id].lv||1;if(l>from&&l<=to)out.push(SKILLS[id].name)});
  return out;
}
function fullHeal(u){u.hp=mhp(u);u.mp=mmp(u);u.buff=0;u.defending=false;u.st=noSt()}
function clampVitals(u){u.hp=Math.min(u.hp,mhp(u));u.mp=Math.min(u.mp,mmp(u))}

function readKey(k){try{var v=JSON.parse(localStorage.getItem(k)||'null');if(v&&(v.v===4||v.v===5)&&typeof v.pos==='number'&&v.party&&v.party.length&&v.inv&&STORY[v.pos]&&STORY[v.pos].t!=='end')return v}catch(e){}return null}
function slotInfo(sv){
  var lv=0;sv.party.forEach(function(p){if(p.lv>lv)lv=p.lv});
  return esc(nodePlace(STORY[sv.pos]))+' · Level '+lv+' · '+sv.inv.gold+' gold · '+esc(DIFFICULTIES[sv.difficulty]?DIFFICULTIES[sv.difficulty].name:'Standard')+(sv.ng?' · NG+ '+sv.ng:'')+(sv.time?' · '+esc(new Date(sv.time).toLocaleString()):'');
}
function saveSlot(n){
  var s=STORY[pos];if(!s||s.t!=='camp')return false;
  try{localStorage.setItem(SLOT_KEYS[n],JSON.stringify({v:5,pos:pos,party:party,inv:inv,flags:flags,difficulty:difficulty,ng:ng,time:Date.now()}));return true}catch(e){return false}
}
function applySave(sv){
  party=sv.party;inv=sv.inv;flags=sv.flags||{};SQ=null;campMsgs=[];ng=sv.ng||0;LOGQ=[];LOGKEY='';
  party.forEach(function(u){u.xp=u.xp||0;u.dbuff=0;if(u.eq)Object.keys(u.eq).forEach(function(sl){if(u.eq[sl]&&(!GEAR[u.eq[sl]]||!canEquip(u,u.eq[sl])))u.eq[sl]=null})});
  pos=sv.pos;difficulty=DIFFICULTIES[sv.difficulty]?sv.difficulty:'standard';B=null;
}
var slotMode='load',slotConfirm=null;
function closeSlots(){var o=document.getElementById('slotov');if(o)o.remove()}
function openSlots(mode){slotMode=(mode==='save'&&screen==='camp')?'save':'load';slotConfirm=null;renderSlots()}
function slotRow(label,sv,id,manual){
  var acts='';
  if(slotMode==='save'&&manual){var c=slotConfirm===id;acts='<button class="btn'+(sv&&!c?' ghost':'')+'" data-sl="save:'+id+'">'+(c?'Confirm overwrite':sv?'Overwrite':'Save here')+'</button>'}
  else if(slotMode==='load'&&sv){acts='<button class="btn" data-sl="load:'+id+'">Load</button>'+(manual?'<button class="btn ghost" data-sl="del:'+id+'">Delete</button>':'')}
  return '<div class="slotrow"><div><b>'+label+'</b><small>'+(sv?slotInfo(sv):'Empty')+'</small></div><div class="acts">'+acts+'</div></div>';
}
function renderSlots(){
  var o=document.getElementById('slotov');
  if(!o){o=document.createElement('div');o.id='slotov';o.className='logov';o.addEventListener('click',slotClick);document.body.appendChild(o)}
  var rows=[slotRow('Autosave',readKey(SAVE_KEY),'auto',false)];
  SLOT_KEYS.forEach(function(k,i){rows.push(slotRow('Slot '+(i+1),readKey(k),String(i),true))});
  var modeBtns=screen==='camp'?'<button class="chip'+(slotMode==='save'?' on':'')+'" data-sl="mode:save">Save</button><button class="chip'+(slotMode==='load'?' on':'')+'" data-sl="mode:load">Load</button>':'';
  o.innerHTML='<div class="logbox" role="dialog" aria-label="Saved games"><h3><span>Saved games</span><button class="btn ghost" data-sl="close" style="padding:.2em .8em">Close</button></h3><div class="logbody">'+
    (modeBtns?'<div class="chips" style="margin-top:8px">'+modeBtns+'</div>':'')+
    (slotMode==='save'?'<p class="camp-note">Manual saves can be made at camp. The autosave updates at every chapter.</p>':'')+rows.join('')+(screen==='title'?'':'<div class="btnrow" style="margin-top:14px"><button class="btn ghost" data-sl="title">Return to title screen</button></div><p class="camp-note" style="margin-top:6px">Your progress is autosaved, so you can continue from the title screen.</p>')+'</div></div>';
}
function slotClick(e){
  var t=e.target.closest('[data-sl]');
  if(!t){if(e.target.id==='slotov')closeSlots();return}
  var p=t.dataset.sl.split(':'),a=p[0],arg=p[1];
  if(a==='close'){closeSlots();return}
  if(a==='title'){closeSlots();campMsgs=[];B=null;SQ=null;showTitle();return}
  if(a==='mode'){slotMode=arg;slotConfirm=null;renderSlots();return}
  if(a==='save'){var ex=readKey(SLOT_KEYS[+arg]);if(ex&&slotConfirm!==arg){slotConfirm=arg;renderSlots();return}saveSlot(+arg);slotConfirm=null;sfx('heal');renderSlots();return}
  if(a==='del'){try{localStorage.removeItem(SLOT_KEYS[+arg])}catch(x){}renderSlots();return}
  if(a==='load'){var sv=readKey(arg==='auto'?SAVE_KEY:SLOT_KEYS[+arg]);if(sv){closeSlots();audioInit();interacted=true;kickMusic();applySave(sv);advance()}}
}
function titleExtras(sv){
  var m=loadMeta(),b=[];

  if(m.ng)b.push('<button class="btn ghost" data-act="ngplus" title="Keep your gear and morality. Veteran difficulty, foes +20% health per cycle.">New Game+ · cycle '+m.ng.level+'</button>');
  if(m.cleared)b.push('<button class="btn ghost" data-act="endless">Bridge · Endless</button>');
  var best=m.endless&&m.endless[0];
  return b.length?'<div class="btnrow" style="margin-top:10px">'+b.join('')+'</div>'+(best?'<p class="sub" style="margin-top:6px">Endless best: '+best.rounds+' rounds survived</p>':''):'';
}

function endKills(){return (B.killed||0)+B.foes.filter(function(f){return f.hp<=0}).length}
function endlessWave(){
  B.wave++;
  var d=BATTLES[B.bi],sc=DIFFICULTIES[difficulty],g=1+0.06*B.wave,keys=['phokan'];
  if(B.wave%3===0)keys.push('phokcap');
  keys.forEach(function(k){B.foes.push(mkFoe(k,{hpMul:(d.hpMul+ngHp())*sc.hp*g,atkMul:d.atkMul*sc.atk*(1+0.03*B.wave)}))});
  say('Wave '+B.wave+': a fresh '+(keys.length>1?'spearman and a captain cross':'spearman crosses')+' the bridge, and the Phokan line hits harder.');
}
function endlessRefill(){
  var d=BATTLES[B.bi],sc=DIFFICULTIES[difficulty],g=1+0.06*B.wave;
  for(var k=0;k<2;k++)B.foes.push(mkFoe('phokan',{hpMul:(d.hpMul+ngHp())*sc.hp*g,atkMul:d.atkMul*sc.atk*(1+0.03*B.wave)}));
  say('The next rank steps onto the bridge.');
}
function quitEndless(){
  if(!B||B.over)return;
